<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>上医智养堂 · 健康管理调优服务平台 — 产品原型</title>
<style>
  :root{
    --ink:#16211D; --ink-2:#3C4A45; --mut:#77857F;
    --bg:#F2F5F4; --card:#FFFFFF; --line:#E1E8E5; --line-2:#EDF2F0;
    --brand:#146E5B; --brand-2:#E6F1EE; --brand-3:#0E5747;
    --gold:#B98A16; --gold-2:#FBF4E2;
    --ok:#2E9E6B; --ok-2:#E7F6EE;
    --warn:#D98218; --warn-2:#FDF3E3;
    --bad:#CF4B4B; --bad-2:#FBECEC;
    --info:#2B6CB0; --info-2:#E8F1FA;
    --r:12px; --r-s:8px;
    --sh:0 1px 2px rgba(16,33,29,.04), 0 8px 24px rgba(16,33,29,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}

  /* ---------- sidebar ---------- */
  .side{background:#0F1F1A;color:#D6E2DD;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{display:flex;gap:10px;align-items:center;padding:0 6px 16px}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(140deg,#1C8A6F,#0E5747);
    display:grid;place-items:center;font-weight:700;color:#EAF6F1;font-size:16px;flex:0 0 auto}
  .brand b{display:block;font-size:14.5px;color:#fff;letter-spacing:.2px}
  .brand span{display:block;font-size:11px;color:#7E958D}
  .side h6{margin:18px 8px 8px;font-size:11px;letter-spacing:.8px;color:#5F7A71;font-weight:600}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav button{
    all:unset;display:flex;gap:9px;align-items:center;cursor:pointer;
    padding:8px 10px;border-radius:8px;color:#C2D3CD;font-size:13px;line-height:1.35;
  }
  .nav button:hover{background:#172C25;color:#fff}
  .nav button.on{background:#1B3A31;color:#fff;font-weight:600}
  .nav .num{
    flex:0 0 20px;height:20px;border-radius:6px;background:#1C332C;color:#8FB3A7;
    display:grid;place-items:center;font-size:11px;font-weight:700
  }
  .nav button.on .num{background:var(--brand);color:#fff}
  .nav .gate{margin-left:auto;font-size:9.5px;padding:1px 5px;border-radius:4px;background:#40222A;color:#F0A9A9;font-weight:700}
  .roles{display:flex;flex-wrap:wrap;gap:6px;padding:0 6px}
  .roles button{all:unset;cursor:pointer;font-size:11.5px;padding:4px 9px;border-radius:20px;
    background:#172C25;color:#9FB8B0;border:1px solid #224038}
  .roles button.on{background:var(--brand);color:#fff;border-color:var(--brand)}

  /* ---------- main ---------- */
  main{min-width:0;display:flex;flex-direction:column}
  .top{
    background:var(--card);border-bottom:1px solid var(--line);
    padding:12px 24px;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:5
  }
  .top .t-title{font-size:15px;font-weight:700}
  .top .t-sub{font-size:11.5px;color:var(--mut);margin-top:1px}
  .ctx{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .chip{
    display:flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);
    border-radius:20px;padding:4px 11px;font-size:11.5px;color:var(--ink-2)
  }
  .chip b{color:var(--ink);font-weight:700}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}

  .stage{padding:22px 24px 60px;max-width:1240px}
  .crumb{font-size:12px;color:var(--mut);margin-bottom:14px}
  .crumb b{color:var(--ink-2)}

  h2.sec{font-size:16px;margin:0 0 4px}
  p.lead{color:var(--ink-2);margin:0 0 16px;font-size:13px}

  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g23{grid-template-columns:1.4fr 1fr}
  @media(max-width:1080px){.g2,.g3,.g23{grid-template-columns:1fr}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
  .card h4{margin:0 0 12px;font-size:13.5px;display:flex;align-items:center;gap:8px}
  .card h4 .tag{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--mut);background:var(--bg);
    border:1px solid var(--line);border-radius:20px;padding:2px 9px}

  .kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:12.5px}
  .kv dt{color:var(--mut)}
  .kv dd{margin:0;color:var(--ink)}

  .rule{border:1px dashed var(--line);border-radius:var(--r-s);padding:10px 12px;background:#FAFCFB;font-size:12px;color:var(--ink-2)}
  .rule b{color:var(--brand-3)}

  ul.tick{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
  /* ul.tick li 是 flex 行：::before 作勾选标记、内容须包在 span 内。
     若直接把富文本（含 <b>）写进 li，每个 <b> 会各自成为**独立的 flex 项**，
     被横向并排成多列 → 文字相互重叠错排（实测 gate / plan / agree / exec 四屏共 9 条命中）。 */
  ul.tick li{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--ink-2)}
  ul.tick li > span{flex:1;min-width:0}
  ul.tick li::before{content:"";flex:0 0 16px;height:16px;margin-top:2px;border-radius:5px;
    background:var(--ok-2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M3.5 8.4l3 3 6-6.6' fill='none' stroke='%232E9E6B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/12px no-repeat}
  ul.tick li.no::before{background:var(--bad-2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M4.5 4.5l7 7M11.5 4.5l-7 7' fill='none' stroke='%23CF4B4B' stroke-width='2' stroke-linecap='round'/></svg>") center/11px no-repeat}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
    padding:3px 9px;border-radius:20px;border:1px solid transparent}
  .p-ok{background:var(--ok-2);color:#1E7A50;border-color:#CBE9DA}
  .p-warn{background:var(--warn-2);color:#9C5C0C;border-color:#F5DFBB}
  .p-bad{background:var(--bad-2);color:#A83434;border-color:#F3CFCF}
  .p-info{background:var(--info-2);color:#1F568F;border-color:#CFE1F5}
  .p-brand{background:var(--brand-2);color:var(--brand-3);border-color:#CBE4DD}
  .p-gold{background:var(--gold-2);color:#8A660F;border-color:#F0E2BB}

  /* big banner */
  .banner{border-radius:var(--r);padding:15px 18px;display:flex;gap:13px;align-items:flex-start;border:1px solid}
  .banner .ico{flex:0 0 34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:16px;font-weight:700;color:#fff}
  .banner b{display:block;font-size:14px;margin-bottom:2px}
  .banner p{margin:0;font-size:12.5px;opacity:.92}
  .bn-ok{background:var(--ok-2);border-color:#CBE9DA;color:#155E3C}
  .bn-ok .ico{background:var(--ok)}
  .bn-bad{background:var(--bad-2);border-color:#F3CFCF;color:#8E2C2C}
  .bn-bad .ico{background:var(--bad)}
  .bn-warn{background:var(--warn-2);border-color:#F5DFBB;color:#8A540F}
  .bn-warn .ico{background:var(--warn)}
  .bn-info{background:var(--info-2);border-color:#CFE1F5;color:#1B5083}
  .bn-info .ico{background:var(--info)}

  /* stepper */
  .steps{display:flex;flex-wrap:wrap;gap:8px}
  .st{flex:1 1 150px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;position:relative;cursor:pointer}
  .st:hover{border-color:var(--brand);box-shadow:var(--sh)}
  .st .i{font-size:10.5px;font-weight:700;color:var(--mut);letter-spacing:.5px}
  .st .n{font-size:12.5px;font-weight:600;margin:2px 0 4px;color:var(--ink)}
  .st .d{font-size:11px;color:var(--mut);line-height:1.45}
  .st.done{border-left:3px solid var(--ok)}
  .st.now{border-left:3px solid var(--brand);background:linear-gradient(180deg,#F7FCFA,#fff)}
  .st.block{border-left:3px solid var(--bad)}
  .st .rk{position:absolute;top:8px;right:9px;font-size:9.5px;color:var(--mut)}

  /* table */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
  th{font-size:11px;letter-spacing:.4px;color:var(--mut);font-weight:700;background:#FAFCFB}
  tbody tr:hover{background:#FAFCFB}
  td b{font-weight:600}

  /* form bits */
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:5px;font-weight:600}
  .input{width:100%;border:1px solid var(--line);border-radius:var(--r-s);padding:8px 11px;font-size:12.5px;background:#fff;color:var(--ink)}
  .input.ph{color:#A9B6B1}
  .checks{display:flex;flex-wrap:wrap;gap:7px}
  .chk{display:flex;gap:7px;align-items:center;font-size:12.5px;background:#FAFCFB;border:1px solid var(--line);
    border-radius:8px;padding:6px 11px;cursor:pointer}
  .chk.on{background:var(--brand-2);border-color:#BBDCD3;color:var(--brand-3);font-weight:600}
  .box{width:14px;height:14px;border-radius:4px;border:1.5px solid #C3D2CD;background:#fff;display:grid;place-items:center}
  .chk.on .box{background:var(--brand);border-color:var(--brand);color:#fff;font-size:10px}

  .btn{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;padding:8px 16px;border-radius:9px;
    background:var(--brand);color:#fff;text-align:center}
  .btn:hover{background:var(--brand-3)}
  .btn.ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--bg)}
  .btn.danger{background:var(--bad)}
  .btn.dis{background:#D8E0DD;color:#8E9A96;cursor:not-allowed;pointer-events:none}
  .btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

  /* signature */
  .sig{border:1px dashed #C3D2CD;border-radius:10px;padding:14px;background:#FCFDFD;position:relative}
  .sig .script{font-family:"Segoe Script","Brush Script MT",cursive;font-size:26px;color:#1E3A32;transform:rotate(-3deg);display:inline-block}
  .seal{position:absolute;right:16px;bottom:10px;width:62px;height:62px;border:2px solid #CF4B4B;border-radius:50%;
    color:#CF4B4B;display:grid;place-items:center;font-size:10px;font-weight:700;line-height:1.2;text-align:center;
    transform:rotate(-12deg);opacity:.82}

  /* progress bar */
  .bar{height:7px;border-radius:6px;background:#E8EEEC;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#2E9E6B,#146E5B)}
  .bar.thin i{background:linear-gradient(90deg,#D98218,#CF4B4B)}

  .tipline{display:flex;gap:8px;font-size:11.5px;color:var(--mut);align-items:center;margin-top:8px}

  .flow{display:flex;flex-direction:column;gap:0}
  .fnode{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:14px}
  .fnode:not(:last-child)::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
  .fnode .bul{flex:0 0 27px;height:27px;border-radius:8px;background:var(--brand-2);color:var(--brand-3);
    display:grid;place-items:center;font-size:11.5px;font-weight:700;z-index:1}
  .fnode.g .bul{background:#FBE9E9;color:#A83434}
  .fnode.y .bul{background:var(--warn-2);color:#9C5C0C}
  .fnode .body{flex:1;min-width:0}
  .fnode .body b{font-size:12.5px}
  .fnode .body p{margin:2px 0 0;font-size:11.5px;color:var(--mut)}

  .foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut);
    display:flex;gap:14px;flex-wrap:wrap}
  .note{font-size:11.5px;color:var(--mut);margin-top:10px}
  code{background:#F1F5F3;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:11.5px;
    font-family:ui-monospace,Consolas,monospace;color:#2C4A40}

  /* ===== 健康资产损益 组件（E 组） ===== */
  .pnlbig{font-size:13px;color:var(--ink-2);margin-bottom:2px}
  .pnlbig b{font-size:30px;font-weight:700;color:var(--brand-3);letter-spacing:-.5px}
  .pnlbig span{font-size:12px;color:var(--mut);margin-left:2px}
  .pnldelta{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:700;
    padding:3px 11px;border-radius:20px;margin-bottom:8px}
  .pnldelta.up{background:var(--ok-2);color:#1E7A50;border:1px solid #CBE9DA}
  .pnldelta.flat{background:#EDF2F0;color:#5C6B66;border:1px solid var(--line)}
  /* 免责声明：客户端强制同屏，逐字固定，不得改写/拆分/缩短 */
  .dname{margin-top:12px;padding:11px 13px;border-radius:var(--r-s);background:#F4FBF8;
    border:1px solid #CBE4DD;border-left:3px solid var(--brand);font-size:12px;color:#155E3C;line-height:1.75}
  .dname div+div{margin-top:5px}
  /* 血氧/手环措辞警示条 */
  .warn-strip{margin-top:10px;padding:9px 12px;border-radius:var(--r-s);background:var(--warn-2);
    border:1px solid #F5DFBB;font-size:11.5px;color:#8A540F;line-height:1.7}
  .warn-strip b{color:#9C5C0C}
  /* 不可见清单 */
  .lockbox{margin-top:12px;padding:11px 13px;border-radius:var(--r-s);background:#FBF7F7;
    border:1px solid #F0DADA;font-size:11.5px;color:#8E2C2C;line-height:1.85}
  .lockbox .lh{font-weight:700;font-size:12px;margin-bottom:5px;color:#A83434}
  /* 端点轴：两轴之间保持视觉空白，不得连线/箭头（AL-6） */
  .axisband{margin-top:6px;margin-bottom:6px}
  .axislabel{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut)}
  .axisgap{height:22px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">上</div>
      <div><b>上医智养堂</b><span>连锁健康管理调优 SaaS</span></div>
    </div>

    <h6>切换角色视角</h6>
    <div class="roles" id="roles"></div>

    <h6>服务链路</h6>
    <div class="nav" id="nav"></div>

    <h6>健康资产损益</h6>
    <div class="nav" id="nav2"></div>

    <h6>原型说明</h6>
    <div style="padding:0 8px;font-size:11px;color:#6E867E;line-height:1.7">
      v0.4 交互原型 · 多门店 SaaS<br/>
      A 组 = 平台层（总部/区域视角）<br/>
      01-10 = 业务层（门店作业链路）<br/>
      E 组 = 健康资产损益（四端可见性）<br/>
      红色标记 = 强制门禁，旁路即违规。
    </div>
  </aside>

  <main>
    <div class="top">
      <div>
        <div class="t-title" id="pageTitle">总览</div>
        <div class="t-sub" id="pageSub">服务全链路与门禁视图</div>
      </div>
      <div class="ctx">
        <div class="chip" style="background:#0F1F1A;border-color:#0F1F1A;color:#9FB8B0">租户 <b style="color:#fff">上医智养堂</b></div>
        <div class="chip">区域 <b>华北区</b></div>
        <div class="chip">门店 <b>秦皇岛店</b></div>
        <div class="chip"><span class="dot"></span>客户 <b>李某某 · C20260815-037</b></div>
        <div class="chip">周期进度 <b>14 次</b> · 已转巩固维护期</div>
        <div class="chip">下次评估 <b>第 21 次</b></div>
      </div>
    </div>
    <div class="stage" id="stage"></div>
  </main>
</div>

<script>
/* ======================= 数据层 ======================= */
/* 端形态（业务方 2026-09-16 补充裁定）：客户=小程序 ｜ 调理师/经络师=APP ｜ 管理员=Web ｜ 门店客服=不使用系统（无端） */
const ROLES = [
  {id:'hq',       name:'总部运营', end:'Web'},
  {id:'area',     name:'区域督导', end:'Web'},
  {id:'manager',  name:'门店负责人', end:'Web'},
  {id:'shop',     name:'门店客服', end:'无端（不使用系统）'},
  {id:'therapist',name:'调理师', end:'APP'},
  {id:'meridian', name:'经络师', end:'APP'},
  {id:'client',   name:'客户', end:'小程序'}
];
const END_OF = {}; ROLES.forEach(r => END_OF[r.id] = r.end);

const SCREENS = [
  {id:'overview', i:'00', n:'服务全链路总览', d:'9 环节闭环 + 3 大门禁', role:'all'},
  {id:'saas',     i:'A1', n:'SaaS 租户与组织架构', d:'品牌 / 区域 / 门店三级租户模型', role:'hq'},
  {id:'policy',   i:'A2', n:'总部管控与门店自治', d:'哪些必须集中，哪些可以放权', role:'hq', gate:'管控'},
  {id:'crossstore',i:'A3', n:'跨店通兑与责任归属', d:'连锁特有 · 客户跨店服务', role:'all'},
  {id:'hqboard',  i:'A4', n:'总部看板与门店健康度', d:'稽核 · 排名 · 反博弈', role:'hq', gate:'稽核'},
  {id:'gate',     i:'01', n:'入口筛查 · 禁忌门禁', d:'硬入口，先于任何信息采集', role:'shop', gate:'门禁'},
  {id:'consent',  i:'02', n:'建档与知情同意', d:'先建档留痕，再签授权与手环意愿', role:'therapist', gate:'前置'},
  {id:'baseline', i:'03', n:'基线评估与诊断', d:'表现类优先 · 年龄段兜底', role:'meridian'},
  {id:'plan',     i:'04', n:'方案出具与审核', d:'完整性 / 有效性 / 可行性', role:'meridian', gate:'门禁'},
  {id:'device',   i:'05', n:'设备参数一键下发', d:'审核通过后自动下发', role:'meridian'},
  {id:'agree',    i:'06', n:'协议书签署与确认', d:'含终止/退出条款（对外禁用承诺性表述）', role:'therapist', gate:'门禁'},
  {id:'exec',     i:'07', n:'执行调理 · 生活方式闭环', d:'每日填报 + 手环采集', role:'therapist'},
  {id:'assess',   i:'08', n:'周期评估（每 7 次）', d:'指标 + 依从性 + 设备数据', role:'meridian'},
  {id:'verdict',  i:'09', n:'效果判定与退款门禁', d:'四条分支 · 判定即动作', role:'manager', gate:'门禁'},
  {id:'close',    i:'10', n:'效果确认与归档结案', d:'趋势归因 · 可脱敏沉淀', role:'manager'},
  {id:'state',    i:'11', n:'状态机与规则配置', d:'业务规则全部可配置', role:'all'},
  {id:'detail',   i:'D1', n:'客户管理详情 · 手环反馈数据', d:'四端皆可见 · 客户端只给数据本身，不给派生结论', role:'all'},
  {id:'pnlClient', i:'E1', n:'健康资产损益 · 客户（小程序）', d:'原始值 + 健康指数 + 变化量 + 手环过程线', role:'client'},
  {id:'pnlTherapist', i:'E2', n:'健康资产损益 · 调理师 / 经络师（APP）', d:'模块级损益明细 · 不含结算类结论', role:'therapist', roles:['therapist','meridian']},
  {id:'pnlAdmin', i:'E3', n:'健康资产损益 · 管理员（Web）', d:'完整内部口径 + 行级 scope', role:'manager'}

function sparkline(data,color,unit){
  const w=100,h=30,mn=Math.min(...data),mx=Math.max(...data),sp=(mx-mn)||1;
  const pts=data.map((v,i)=>`${(i/(data.length-1)*w).toFixed(1)},${(h-((v-mn)/sp)*(h-6)-3).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:34px;display:block">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${w}" cy="${(h-((data[data.length-1]-mn)/sp)*(h-6)-3).toFixed(1)}" r="2.2" fill="${color}"/></svg>`;
}
function ring(pct,color,label){
  const r=26,c=2*Math.PI*r;
  return `<div style="display:flex;align-items:center;gap:12px">
    <svg width="66" height="66" viewBox="0 0 66 66">
      <circle cx="33" cy="33" r="${r}" fill="none" stroke="#E8EEEC" stroke-width="7"></circle>
      <circle cx="33" cy="33" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}" transform="rotate(-90 33 33)"></circle>
      <text x="33" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#16211D">${pct}</text>
    </svg>
    <div><div style="font-size:12.5px;font-weight:600">${label[0]}</div><div style="font-size:11.5px;color:#77857F">${label[1]}</div></div>
  </div>`;
}
/* 手环过程线：缺段显式断开（AL-3）—— 不插值、不平滑、不跨缺段连线 */
function processLine(series,color,unit){
  const w=100,h=30;
  const vals = series.filter(v=>v!==null);
  const mn=Math.min(...vals), mx=Math.max(...vals), sp=(mx-mn)||1;
  const y = v => (h-((v-mn)/sp)*(h-6)-3).toFixed(1);
  const segs=[]; let run=[];
  series.forEach((v,i)=>{
    if(v===null){ if(run.length) segs.push(run); run=[]; return; }
    run.push(`${(i/(series.length-1)*w).toFixed(1)},${y(v)}`);
  });
  if(run.length) segs.push(run);
  const lines = segs.map(s=> s.length>1
    ? `<polyline points="${s.join(' ')}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`
    : `<circle cx="${s[0].split(',')[0]}" cy="${s[0].split(',')[1]}" r="1.6" fill="${color}"/>`).join('');
  const last=series.length-1;
  const tail = series[last]!==null ? `<circle cx="${w}" cy="${y(series[last])}" r="2.2" fill="${color}"/>` : '';
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:34px;display:block">${lines}${tail}</svg>`;
}
/* 量表端点：两个端点画成标记点，不画折线（AL-2）—— 只有两点，连线会暗示中间是线性变化 */
function endpointAxis(baseVal, curVal, max){

    <circle cx="${px(baseVal)}" cy="11" r="3.4" fill="#FFFFFF" stroke="#77857F" stroke-width="1.8"/>
    <circle cx="${px(curVal)}" cy="11" r="3.4" fill="#146E5B" stroke="#146E5B" stroke-width="1.8"/>
  </svg>`;
}

    + rule('<b>⚠️ 新记账的失效模式 R4c「调理师 → 经络师转交失真」：</b>客户提退款的第一句话往往是说给<b>正在给他做调理的人</b>，而<b>调理师端同样不显示退款字样</b> → "调理师告诉经络师"这一句在系统里<b>是一段空白</b>。原话可被软化、被延迟，且 <b>24h 代录计时从哪一刻起算仍不可知</b>。<br/>三层失效模式需分清：<b>R4a 结构性</b>（观测权归零）／<b>R4b 执行性</b>（记了但延迟，<b>仍留下记录</b>）／<b>R4c 传递性</b>（客户认为他已提出过，而系统里什么都查不到 —— 正是中山中院那类判词的对立面）。<br/><b>培训改不了动机</b>：调理师在收入链条里，"劝下来"的收益比客服更大，故 R4c 与 R4b 部分重叠，但责任主体不同（上游传递缺失 vs 代录人执行不到位）。')
    + rule('<b>失去客户端入口后的强制兜底（必须实现）：</b>门店须在 <b>24 小时内</b>把客户口头 / 微信提出的退款诉求<b>代录进系统并回执客户</b>；"录入延迟"纳入总部可查的异常名单，超时自动升级。<br/><b>为什么：</b>客户端无入口 = 失去"客户何时提出"的自动时间戳；中山中院 2026-04 案判词明确——经营者拿不出消费记录与服务单据，法院可作<b>对经营者不利</b>的事实认定。代录纪律是唯一的替代证据。')
    + rule('<b>注意：</b>本规则使原 CS-3「退款入口在客户端唯一」<b>作废</b>；两条通路（履约类 / 效果类）的划分不变，<b>仅发起方由客户端改为门店（经络师 / 负责人）代客发起</b>，算法仍为"未消耗次数 × 单次均价（实付）"。'))}</div>`;

    ${card('稽核信号（门店不可见）','放水与规避行为监测',`<table><thead><tr><th>信号</th><th>口径</th><th>阈值（建议值）</th><th>处置</th></tr></thead><tbody>
      <tr><td>判定宽松度</td><td>某经络师"稳定/改善"占比 ÷ 全网均值</td><td>&gt;1.3</td><td>抽检近 30 天判定留痕</td></tr>
      <tr><td>判定过快</td><td>评估提交 → 判定落库 间隔</td><td>&lt;5 分钟</td><td>强制二次复核，冻结自动判定</td></tr>
      <tr><td>方案雷同度</td><td>方案文本/参数组合重复率</td><td>&gt;85%</td><td>模板滥用审查，回炉重出</td></tr>
      <tr><td>退款受理延迟</td><td>申请 → 受理确认 时长</td><td>&gt;48 小时</td><td>自动升级至区域</td></tr>
      <tr><td>原因集中</td><td>"体验类"退款原因占比</td><td>&gt;60%</td><td>原因真实性复核</td></tr>
      <tr><td>挽留缺省</td><td>挽留发起率（发起 / 应发起）</td><td>&lt;50%</td><td>核查是否漏配挽留流程</td></tr>
    </tbody></table>

    <tr><td>NRR（净收入留存）</td><td>期初客群本期收入 ÷ 期初收入</td><td>≥100%</td></tr>
    <tr><td>单店月均活跃客户数</td><td>活跃客户 / 活跃门店</td><td>≥50</td></tr>
    <tr><td>总部模板采纳率</td><td>采用总部标准方案数 / 总方案数</td><td>≥70%</td></tr>

/* ======================= D1 客户管理详情 · 手环反馈数据 =======================

   展示边界（PRD §2.6.2）：
     W-1 客户端可见手环数据本身，不可见由它推导出的一切 —— 一律不下发 + 后端 403 双验；
     W-2 客户端一律「正向计数 + 中性描述」（仅「已采集 N 天」「该日暂无数据」）；

let bandLinked = true;
function toggleBand(){ bandLinked = !bandLinked; render(); }

P.detail = () => {

  const who = isAll ? '全部角色（对照视图）' : (r.name + ' · ' + r.end);

  if (isNoEnd) {
    return `
    <div class="crumb">客户管理 / <b>D1 客户管理详情 · 手环反馈数据</b> · 当前角色：门店客服 · 无端（不使用系统）</div>

    ${card('四端适配一览','本屏适配的端形态（业务方 2026-09-16 裁定）',`
      <table><thead><tr><th>端 / 角色</th><th>端形态</th><th>手环数据可见范围</th></tr></thead><tbody>
        <tr><td>客户端（客户）</td><td>小程序</td><td>${chip('ok','可见 · 仅原始数据与采集状态')}</td></tr>
        <tr><td>调理师端（调理师）</td><td>APP</td><td>${chip('ok','可见 · 含内部字段，不作不利依据')}</td></tr>
        <tr><td>经络师端（经络师）</td><td>APP</td><td>${chip('ok','可见 · 含内部字段')}</td></tr>
        <tr><td>管理端（门店负责人 / 区域督导 / 总部运营）</td><td>Web</td><td>${chip('ok','可见 · 按行级范围')}</td></tr>
        <tr><td>门店客服</td><td>无端（不使用系统）</td><td>${chip('bad','不适用 · 无端')}</td></tr>
      </tbody></table>
      <div class="note">切换顶部角色按钮即可查看其余四端的实际呈现（端形态与角色是一对多：管理端 Web 同时承载三个管理角色）。</div>`)}`;
  }

  /* ① 原始数据 + ② 采集状态：四端同源，均可见（客户端走正向计数 + 中性描述） */
  const raw = `
    <div class="grid g2" style="margin-top:16px">
      ${card('① 原始数据（近 7 天）','设备自动采集 · 客户级数据',`
        <table><thead><tr><th>数据项</th><th>数值</th><th>单位</th><th>已采集</th></tr></thead><tbody>
          <tr><td>睡眠时长（日均）</td><td><b>6.4</b></td><td>小时</td><td>6 / 7 天</td></tr>
          <tr><td>深睡时长（日均）</td><td><b>1.3</b></td><td>小时</td><td>6 / 7 天</td></tr>
          <tr><td>步数（日均）</td><td><b>6,180</b></td><td>步</td><td>6 / 7 天</td></tr>
          <tr><td>静息心率（周均）</td><td><b>64</b></td><td>次/分</td><td>7 / 7 天</td></tr>
          <tr><td>血氧（周均）</td><td><b>97</b></td><td>%</td><td>5 / 7 天</td></tr>
          <tr><td>运动时长（日均）</td><td><b>42</b></td><td>分钟</td><td>6 / 7 天</td></tr>
        </tbody></table>
        <div class="note">手环佩戴完全自愿，数据按实际采集逐日展示。同一客户跨店服务时，本页数据<b>随客户移动</b>，不做门店锁定。</div>
        ${rule('<b>数据来源：</b>手环 → 厂商 App → 厂商云 → <b>我方服务端（唯一权威）</b> → 本页。三端（小程序 / APP / Web）<b>都是消费方，各自从服务端取数</b> —— <b>本端不持有权威副本，也不转发给其他端</b>。')}`)}
      ${card('② 采集状态','同步时间精确到日 · 正向计数',`

        <div class="bar"><i style="width:86%"></i></div>
        <div class="kv" style="margin-top:12px">
          <dt>最近同步</dt><dd>2026-09-16</dd>
          <dt>接入状态</dt><dd>${bandLinked ? chip('ok','已接入 · 手环在线') : chip('warn','手环未接入')}</dd>
        </div>
        <div class="note">09-10 有数据 · 09-11 有数据 · 09-12 有数据 · 09-13 有数据 · 09-14 有数据 · 09-15 有数据 · <b>09-16 该日暂无数据</b></div>`)}
    </div>`;

  /* 接入未就绪空态：展示与接入分离，不得以 0 / 空图表 / 示例数据顶替 */
  const unlinked = `
    ${banner('warn',['手环未接入 —— 本屏不显示任何数值','按「展示与接入分离」约束：接入未就绪时显示<b>「手环未接入」</b>，<b>不得显示 0 值、空图表或示例数据</b>——「空白」与「未采集到」必须可区分。'],'⌚')}
    <div class="grid g2" style="margin-top:14px">
      ${card('① 原始数据','接入未就绪',`${ticks([['手环未接入：请先完成设备绑定'],['本区域不展示 0 值、空图表与示例数据'],['接入完成后，数据按日回填展示']])}`)}
      ${card('② 采集状态','接入未就绪',`<div class="kv"><dt>最近同步</dt><dd>—</dd><dt>接入状态</dt><dd>${chip('warn','手环未接入')}</dd></div>${rule('接入状态与展示状态分离：接入未就绪时历史数据保留，不回填为 0，也不以示例数据占位。')}`)}
    </div>`;

  /* 客户端专属边界说明（W-1 / W-2 / W-3） */
  const clientExtra = `
    <!--CLIENT-VIEW-START-->
    ${card('为什么你在这一页只看到这些','客户端展示边界（W-1 / W-2 / W-3）',`
      ${ticks([
        ['手环数据是你日常状态的一项参考，不单独用于任何判定',''],
        ['同步时间精确到日：2026-09-16',''],
        ['只做正向计数与中性描述：显示「已采集 6 / 7 天」，未采集到的日期显示「该日暂无数据」',''],
        ['本页不出现由设备数据推导出的其他内容',''],
        ['设备尚未接入时，本页显示「手环未接入」，不显示 0 值、空图表或示例数据','']
      ])}
      <div class="note">本页仅展示设备采集到的原始数据；其余服务信息以门店沟通为准。</div>`)}
    <!--CLIENT-VIEW-END-->`;

  /* 内部角色专属：③ 缺口原因 + ④ 派生结果 */
  const staffExtra = `
    <div class="grid g2" style="margin-top:14px">
      ${card('③ 缺口原因分类','内部字段 · gap_reason',`
        <table><thead><tr><th>缺口情形</th><th>计入规则</th></tr></thead><tbody>
          <tr><td>${chip('warn','未佩戴')}</td><td>按中性计入，<b>不计为不依从</b></td></tr>
          <tr><td>${chip('warn','同步失败')}</td><td>按中性计入，不计为不依从</td></tr>
          <tr><td>${chip('warn','设备未接入')}</td><td>整段按中性计入，不参与任何扣分</td></tr>
          <tr><td>${chip('warn','客户未携带设备')}</td><td>按中性计入，不计为不依从</td></tr>
        </tbody></table>
        ${rule('<b>缺口不得作为不利依据：</b>上述四类一律按中性计入依从性，任何一类都不得单独触发降级判定或结算动作。')}`)}
      ${card('④ 派生结果','依从性 / 判定 / 结算（内部）', bandLinked ? `
        ${ring(71,'#D98218',['依从性 A3 = 71%','手环有效佩戴率权重 0.20 · 小程序填报 86%'])}
        <div class="grid" style="margin-top:12px;gap:8px">
          <div class="rule"><b>AS 综合依从性</b>：78% · 门槛 ≥ 80% ${chip('warn','未达门槛')} <span style="color:#77857F">（建议值，需真实数据校准）</span></div>
          <div class="rule"><b>效果判定</b>：${chip('ok','稳定 / 改善')} —— 以核心指标为主判据，<b>手环只进依从性、不进效果主判据</b></div>
          ${canSeeRefund()
            ? `<div class="rule"><b>退款资格</b>：${chip('info','缺口不构成触发项')} —— 缺口按中性计入，不单独触发结算动作</div>`
            : `<div class="rule">${chip('info','本角色不展示结算相关内容')} —— 按本角色可见性规则，该行仅对经络师与管理者可见</div>`}
        </div>
        ${rule('<b>④ 只作过程性参考，不得单独作为不利依据</b>（调理师角色同样适用）。本卡的「手环可见性」与「结算可见性」是<b>两个独立维度</b>，各自按配置执行，不得合并。')}`
      : `
        ${ticks([
          ['手环未接入 → A3 手环有效佩戴率<b>按中性计入</b>，本轮不产出基于手环的派生结果','no'],
          ['本卡不显示任何推导出的数值（不显示 0%、不显示空圆环、不显示示例值）','no'],
          ['依从性其余构成（到店履约 / 小程序填报 / 生活方式核对）照常计算，不受影响',''],
          ['接入完成后，A3 从接入之日起按实际采集逐日回填，不追溯补齐历史','']
        ])}
        ${rule('<b>接入未就绪 ≠ 数值为 0。</b>「未采集到」与「采集到了但为 0」必须可区分——因此本卡在未接入时整体不出数值，而非给出 0 值占位或空图表。')}`)}
    </div>`;

  /* 内部角色专属：四端矩阵与合规约束 */
  const matrix = `
    <div style="margin-top:14px">
    ${card('四端可见性矩阵（手环数据 × 字段组）','按「角色 × 字段组」配置 · config #43 band_visibility',`
      <table><thead><tr><th>端 / 角色</th><th>① 原始数据</th><th>② 采集状态</th><th>③ 缺口原因</th><th>④ 派生结果</th></tr></thead><tbody>
        <tr><td>客户端（小程序）</td><td>${chip('ok','可见')}</td><td>${chip('ok','可见')}</td><td>${chip('bad','不可见')}</td><td>${chip('bad','不可见')}</td></tr>
        <tr><td>调理师（APP）</td><td>${chip('ok','可见')}</td><td>${chip('ok','可见')}</td><td>${chip('ok','可见')}</td><td>${chip('ok','可见')} · 不作不利依据</td></tr>
        <tr><td>经络师（APP）</td><td>${chip('ok','可见')}</td><td>${chip('ok','可见')}</td><td>${chip('ok','可见')}</td><td>${chip('ok','可见')}</td></tr>
        <tr><td>管理端（Web · 门店负责人 / 区域督导 / 总部运营）</td><td>${chip('ok','可见')}</td><td>${chip('ok','可见')}</td><td>${chip('ok','可见')}</td><td>${chip('ok','可见')} · 按行级范围</td></tr>
        <tr><td>门店客服</td><td colspan="4">无端（不使用系统）· 该界面不成立</td></tr>
      </tbody></table>
      ${rule('<b>跨店：</b>手环数据是<b>客户级</b>数据，随客户跨店移动，<b>不做门店锁定</b>（与跨店通兑口径一致）。')}
      ${rule('<b>X-1 服务端判定：</b>可见性一律由服务端裁定并以后端 403 兜底；客户端 ③④ 是<b>不下发</b>，不是前端隐藏。')}
      ${rule('<b>config #43「band_visibility」</b>：按「角色 × 字段组」配置（四档），fail-closed、变更留痕；客户侧 ③④ 为硬约束，不得通过配置放开。<b>与 #40「结算可见性」是两个独立配置，不得合并</b>——结算可见性是角色级二分，手环可见性是角色 × 字段组四档。')}
      ${rule('<b>与结算可见性的关系：</b>本屏只解决「能不能看到手环数据」；「能不能看到结算相关内容」仍按既有可见性矩阵执行。两者是独立维度，不得混淆。')}`)}
    </div>`;

  return `
  <div class="crumb">客户管理 / <b>D1 客户管理详情 · 手环反馈数据</b> · 当前角色：${who}</div>
  ${banner('info',[ isClient ? '手环数据在客户端只给「数据本身」，不给由它推导出的结论' : '手环反馈数据四端皆可见，但可见范围按角色分档',
    isClient ? '你看到的是设备采集到的原始数据与采集状态；其余服务信息以门店沟通为准。'
             : '同一份数据在客户端、调理师端、经络师端与管理端的展示范围不同：客户端只看原始数据与采集状态，内部角色额外可见缺口原因与派生结果。' ],'⌚')}
  ${bandLinked ? raw : unlinked}
  ${isClient ? clientExtra : staffExtra}
  ${isClient ? '' : matrix}
  <div class="btnrow" style="margin-top:14px">
    <button class="btn ghost" onclick="toggleBand()">状态演示：切换为「${bandLinked ? '手环未接入' : '手环已接入'}」</button>
  </div>`;
};

/* ================= E 组 · 健康资产损益（四端可见性） =================
   口径基准：_work/health-asset-pnl-design-2026-09-20.md（v3 定稿）
   方向翻转 H = 112 − T（量表为症状向，0 分 = 无症状 = 最佳）
   对齐规则 AL-1~AL-6 · 免责声明 D-1/D-2/D-3 · 血氧措辞约束三条
   ───────────────────────────────────────────────────────────── */
/* 同一客户 · 同一份数据的基准值（虚构演示数据） */
const PNL = {
  Hbase: 72, Hcur: 88, Tmax: 112,
  base: '2026-08-15', cur: '2026-11-02',
  admit: 0.76,          // 手环覆盖率（仅内部）
  bandSince: '2026-08-20',
  dims: [               // 7 维：模块级可落地的 5 个 + 2 个孤儿维（不参与效果判定）
    {name:'睡眠质量',      b:11, c:14, mod:'M1 睡眠',      orphan:false},
    {name:'肩颈腰背筋骨',  b:9,  c:12, mod:'M2 疼痛筋骨',  orphan:false},
    {name:'代谢体态消化',  b:10, c:12, mod:'M3 代谢消化',  orphan:false},
    {name:'情绪抗压',      b:10, c:12, mod:'M4 情绪压力',  orphan:false},
    {name:'体能精力',      b:11, c:13, mod:'M5 疲劳体能',  orphan:false},
    {name:'面部气色肤质',  b:12, c:13, mod:'（部分承载）',  orphan:true},
    {name:'记忆专注',      b:9,  c:9,  mod:'（孤儿维 · 不纳入判定）', orphan:true}
  ]
};
const dirWord = d => d>0 ? '向好' : (d===0 ? '平稳' : '与期初接近');
const dirCls  = d => d>0 ? 'up' : 'flat';

P.pnlClient = () => {
  const dH = PNL.Hcur - PNL.Hbase;
  return `
  <div class="crumb">健康资产损益 / <b>E1 客户（小程序）</b> · 当前角色：客户</div>
  ${banner('info',['这是您本人的健康记录 —— 从期初到现在的变化','系统把每次评估的读数记录成一条可对照的线。<b>这里显示的是记录本身，不是对调理效果的评价。</b>'],'📈')}
  <div class="grid g2" style="margin-top:16px">
    ${card('健康指数','当前值 + 变化量',`
      <div class="pnlbig">当前 <b>${PNL.Hcur}</b><span>/ ${PNL.Tmax}</span></div>
      <div class="pnldelta ${dirCls(dH)}">较期初 ${dH>0?'+':''}${dH} · ${dirWord(dH)}</div>
      <div class="kv" style="margin-top:10px">
        <dt>期初</dt><dd>${PNL.Hbase} <span style="color:#77857F">（${PNL.base}）</span></dd>

      <div class="axisband">

    ${PNL.dims.map(d=>{const dd=d.c-d.b;return `<tr><td>${d.name}</td><td>${d.b}</td><td>${d.c}</td><td>${dd>0?'+':''}${dd}</td><td>${chip(dd>0?'ok':'info',dirWord(dd))}</td></tr>`;}).join('')}
  </tbody></table>
  ${rule('<b>记忆专注</b>这一维期初与本次读数相同 —— 该维未纳入周期复评，本次沿用期初读数，<b>不代表「没有变化」</b>。')}`)}
  ${card('手环记录 · 逐日过程线','按天记录 · 缺段如实断开',`
    <div style="font-size:11.5px;color:#77857F;margin-bottom:6px">夜间心率（次/分）· 数据可得区间 ${PNL.bandSince} → ${PNL.cur}</div>

    ${rule('曲线上<b>断开的缺口</b>＝那几天设备没有采集到数据。<b>缺口如实断开、不补点、不连线</b> —— 我们不会用推算值把线补平。')}
    <div class="warn-strip">
      <div><b>① 手环数据为参考之一，不用于单方判定。</b></div>

  <div style="margin-top:14px">
    ${card('本页边界（如实告知）','为什么有些内容看不到',`
      <div class="lockbox">
        <div class="lh">以下内容不在本页展示，也不下发到本端：</div>
        ① 佩戴率，以及任何评价性的结论<br/>
        ② 效果判定结论，以及与判定相关的门槛数值<br/>
        ③ 任何形式的比率（%）与倒计时<br/>
        ④ 血压 / 体温 / 血糖 / 尿酸（设备不具备或无展示口径，本页不呈现）<br/>
        ⑤ 静息心率——其展示口径仍在裁定中，本页暂不展示（见 U-17）

  </div>`;
};

      ${PNL.dims.filter(d=>!d.orphan).map(d=>{const dd=d.c-d.b;return `<tr><td>${d.mod}</td><td>${d.b}</td><td>${d.c}</td><td>${dd>0?'+':''}${dd}</td><td>${chip(dd>0?'ok':'info',dirWord(dd))}</td></tr>`;}).join('')}

  </div>
  ${card('本角色的能力边界','角色级差异化 · 服务端判定',`

      ['不可见：改善率（IR）、MCID 判定结论、效果判定结论','no'],
      ['不可见：结算相关内容 —— 该行由角色级配置单独控制，与本卡不共用开关','no'],
      ['可见性一律由服务端判定并以后端 403 兜底，端上不得仅靠前端隐藏','']
    ])}
    ${rule('<b>「健康类 vs 结算类」是一条清晰的分界线</b>：本视图负责健康类；结算类属于另一套角色可见性配置，两者<b>不得合并</b>。')}`)}`;

        <dt>命名</dt><dd>可用「健康资产损益」</dd>
      </div>
      <div class="lockbox" style="margin-top:12px">
        <div class="lh">🛑 本视图仍不提供：</div>

/* ======================= 交互 ======================= */
function gateResult(hasContra){
  const el = $('#gateOut'); if(!el) return;
  el.innerHTML = hasContra
    ? banner('bad',['已拦截：客户不符合服务条件','档案状态 → REJECTED。<b>不建档</b>，仅保留本条筛查记录（含结论、筛查人、时间快照）；建档、评估、出方案入口全部置灰；记录不可删除。'],'⛔')
    : banner('ok',['已放行：无禁忌，进入客户建档','下一步进入建档（状态 <code>PROFILED</code>）。签署知情同意书在<b>建档之后</b> —— 客户拒签时档案仍在，记录可查。'],'✓');
}
function go(id){ if(!SCREENS.find(s=>s.id===id)) return; cur=id; render(); window.scrollTo({top:0,behavior:'smooth'}); }

/* 屏可见性判定的唯一真相源：导航过滤与 setRole 兜底都必须走这里。
   roles[] 支持「一屏覆盖同端的多个角色」（如 E2 同时服务调理师与经络师 —— 二者同为 APP 端）。
   若各写一份过滤条件，改名/加角色时极易漂移。 */
const visFor = (s, role) => s.role==='all' || role==='all' || s.role===role || (s.roles||[]).indexOf(role)>=0;

function renderNav(){
  const mine = s => visFor(s, curRole);
  const btn = s => `
    <button class="${s.id===cur?'on':''}" onclick="go('${s.id}')">
      <span class="num">${s.i}</span><span>${s.n}</span>${s.gate?`<span class="gate">${s.gate}</span>`:''}
    </button>`;
  /* 分组渲染：主链路组不含 E 组，E 组单独一栏 */
  const isPnl = s => s.id.indexOf('pnl') === 0;
  $('#nav').innerHTML  = SCREENS.filter(s=>!isPnl(s) && mine(s)).map(btn).join('');
  $('#nav2').innerHTML = SCREENS.filter(s=> isPnl(s) && mine(s)).map(btn).join('');
  $('#roles').innerHTML = [{id:'all',name:'全部',end:'三端'},...ROLES].map(r=>
    `<button class="${r.id===curRole?'on':''}" onclick="setRole('${r.id}')">${r.name}<span style="opacity:.55;font-size:11px;margin-left:6px">${r.end}</span></button>`).join('');
}
function setRole(id){
  curRole = id;
  const visible = SCREENS.filter(s => visFor(s, id));
  if(!visible.find(s=>s.id===cur)) cur = visible[0].id;
  render();
}
/* ===== 退款可见性（业务方规则：客户端 / 调理师端不显示"退款"字样） ===== */
const REFUND_ROLES = ['meridian','manager','hq','area'];  // 经络师 + 管理员（总部运营 / 门店负责人）+ 区域督导
function canSeeRefund(){ return curRole === 'all' || REFUND_ROLES.indexOf(curRole) >= 0; }
/* ===== 超管可见性（文书模板上传 / 编辑 / 下载的 tenant 级权限，P0-27「门店只读」） =====
   与 canSeeRefund() 同款写法：单一判定入口，避免在 P.agree 里内联写死角色比较。
   06 屏 SCREENS 的 role 保持 'therapist' 不变，上传区靠本函数条件渲染。
   'all'（对照视图）计入，使超管视野在总览模式下也可被检验。 */
const SUPER_ADMIN_ROLES = ['hq'];
function isSuperAdmin(){ return curRole === 'all' || SUPER_ADMIN_ROLES.indexOf(curRole) >= 0; }
function maskRefundText(root){
  if(canSeeRefund()) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const hits = []; let n;
  while((n = w.nextNode())){
    if(n.nodeValue.indexOf('退款') < 0) continue;
    if(n.parentElement && n.parentElement.closest('[data-nomask]')) continue;
    hits.push(n);
  }
  hits.forEach(t => { t.nodeValue = t.nodeValue.split('退款').join('▨▨▨'); });
}
function render(){
  const s = SCREENS.find(x=>x.id===cur) || SCREENS[0];
  $('#pageTitle').textContent = s.n;
  $('#pageSub').textContent = s.d;
  $('#stage').innerHTML = (P[cur] || P.overview)();
  /* 遮蔽只作用于 #stage。页面标题（#pageTitle/#pageSub）不在遮蔽范围内，
     故 SCREENS 的 n/d 文案本身必须「按最严角色可读」——不得写入退款字样，
     否则调理师 / 客户角色会在页面抬头看到未遮蔽的「退款」。见 _verify_pnl.js 断言 O。 */
  maskRefundText($('#stage'));
  if(!canSeeRefund()){
    const r0 = ROLES.find(r => r.id === curRole) || {};
    const roleName = (r0.name || curRole) + (r0.end ? ' · ' + r0.end : '');
    $('#stage').insertAdjacentHTML('afterbegin',
      `<div class="banner bn-warn" style="margin-bottom:14px" data-nomask><div class="ico">🔒</div><div><b>本角色（${roleName}）不显示退款相关内容</b><p>按业务方规则：<b>客户端（客户）与调理师端不出现"退款"字样与入口</b>，本页相关字样已遮蔽为 ▨▨▨。仅<b>经络师</b>与<b>管理员（总部运营 / 门店负责人）</b>可见并可操作——切换顶部角色即可看到完整内容。</p><p style="margin-top:8px">跨端硬约束：① 可见性<b>一律由服务端判定</b>（后端 403），任何端都不得仅靠前端隐藏；② <b>小程序包内不得包含"退款"字样、文案资源与退款接口</b>；③ 同一 <b>APP 内角色级差异化</b>——退款能力只在经络师角色下加载。</p></div></div>`);
  }
  renderNav();
}
render();
</script>
