name: build-and-test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

# 防止并发重复构建同一 ref
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 8 模块 clean install（含全量测试 + 码级门禁）
    runs-on: ubuntu-latest
    # 🛑 CI 首跑实证（run 37796021603，2026-10-08）：clean install 的测试面里有
    #   三族**真库门禁**，它们按 ADR-09 fail-closed —— 连不上 PostgreSQL 就视为
    #   "缺少链完整性测试"，构建必须失败（这是设计，不是 flaky）：
    #     ① dy-audit 的 AuditChainGateTest —— 用 psql 以超级用户 postgres /
    #        ${DY_PG_SUPER_PASSWORD:postgres} 自建角色与库，但服务器必须先在；
    #     ② dy-app 的 RlsGateSupport 族 —— 同为 fail-closed，自建库（连 /postgres）；
    #     ③ dy-app 的 @SpringBootTest E2E 族 —— 按 application.yml 连
    #        localhost:5432/diaoyuanyun_dev，用户 ${DB_USERNAME:diaoyuanyun}。
    #   本机一直绿，是因为本机常驻一个配置好的 Postgres；runner 是一次性环境，
    #   必须把"库"作为服务显式声明出来 —— 第 48 条（写下的命令 ≠ 跑得起来的命令）
    #   在 CI 侧的又一实例：命令没错，错的是"命令依赖的环境没有被声明"。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DY_PG_HOST: 127.0.0.1
      DY_PG_PORT: "5432"
      DY_PG_SUPER_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # 🛑 本 job 必须有 Python，且必须带 PyYAML —— 不是"顺手装一个"，是两处硬依赖：
      #    ① `mvn clean install` 在 **validate** 阶段就跑若干 Python 门禁
      #       （根 pom.xml 的 s16 / s18 / s19 exec 门禁 + ADR-12 词表扫描）；
      #    ② 这些门禁**刻意**要求一个真正的 YAML 解析器（实测两个手写正则探针在同一份
      #       契约上互相矛盾，42 vs 2 个字段），缺 PyYAML 一律 **exit 2**，
      #       **不会**退化成正则后照常打印 PASS。
      #    ⇒ 此前本 job 一个 Python 步骤都没有，在干净 runner 上**必然红**，
      #      而且红的措辞会把排查引向"契约不一致"这个完全错误的方向。
      #    另：裸 ubuntu-latest 上 `python` 未必存在（通常只有 `python3`），
      #    而根 pom.xml 的 `compliance.python.executable` 默认值**就是** `python`
      #    ⇒ 不 setup-python 还会额外撞上"找不到命令"。setup-python 会同时提供
      #    `python` 与 `python3` 两个入口。
      #    参照：`.github/workflows/compliance-gate.yml` 一直有这一步，本文件此前漏了。
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the gates' YAML parser
        run: python -m pip install --disable-pip-version-check -r skeleton/requirements.txt
      # psql 是 AuditChainGateTest 自建角色/库的硬前提（它 shell 出去调 psql）。
      # 先探测、缺了才装 —— 与 rls-isolation-gate.yml 同款，不为一个通常已存在的
      # 二进制白等一次 apt。
      - name: Ensure the psql client is available
        run: |
          if command -v psql >/dev/null 2>&1; then
            echo "psql already present: $(psql --version)"
          else
            sudo apt-get update
            sudo apt-get install -y postgresql-client
            psql --version
          fi
      # 补建 dy-app E2E 门禁期望的角色与库（与 rls-isolation-gate.yml 同款同因，
      # 详见该文件的 Provision 步骤注释）。AuditChainGateTest / RlsGateSupport
      # 的角色与库由测试自己建，这里只补 @SpringBootTest 族要的 diaoyuanyun。
      - name: Provision the diaoyuanyun role and databases (dy-app E2E expectations)
        run: |
          PGPASSWORD="$DY_PG_SUPER_PASSWORD" psql -X -h "$DY_PG_HOST" -p "$DY_PG_PORT" \
            -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE diaoyuanyun LOGIN PASSWORD 'diaoyuanyun';" \
            -c "CREATE DATABASE diaoyuanyun OWNER diaoyuanyun;" \
            -c "CREATE DATABASE diaoyuanyun_dev OWNER diaoyuanyun;"
          echo "已就绪：role diaoyuanyun + db diaoyuanyun / diaoyuanyun_dev"
      - name: Build & test (clean install)
        working-directory: skeleton
        run: mvn -B -ntp clean install
      # 真库校验 / 反向验证脚本（如有 Postgres 服务可在此接）
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: skeleton/**/target/surefire-reports/*.txt

  frontend:
    name: 三端前端工程自检 + 行为测试 + 反向验证
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 🛑 与 backend job 同因：端 C 的 `npm run build`
      #    （tools/build-check.mjs --end=client-mp）会调
      #    `gen-endpoints.py --check` 校验"契约改了但端点层没重跑"，
      #    而生成器缺 PyYAML 时 exit 2 ⇒ 本 job 也会红。
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the gates' YAML parser
        run: python -m pip install --disable-pip-version-check -r skeleton/requirements.txt

      - name: 安装端 A / 端 B 依赖
        working-directory: skeleton/frontends
        # 🛑 第 79 条：**必须先归一「依赖源」，否则本步依赖一个第三方镜像。**
        #
        #    两份 package-lock.json 的 `resolved` 共 304 条（端 A 182 + 端 B 122）
        #    **全部**指向 `registry.npmmirror.com`（本机在中国、生成锁文件时用的淘宝镜像），
        #    而 `npm ci` 的语义是**逐字沿用锁文件里的 URL**，不是"按 registry 重解析"。
        #    实测（最小复现，单包 is-number@7.0.0）：
        #      · 不覆盖 → 真去拉的地址是 registry.npmmirror.com + cdn.npmmirror.com
        #      · 覆盖后 → registry.npmjs.org
        #    ⇒ 不归一，本 job 的"能不能装"就取决于一个我们不受控的 CDN。
        #
        #    `replace-registry-host` 是 npm ≥ 8.8 的**官方开关**（默认 `npmjs`，
        #    意为"只替换官方 host" —— 而我们的锁文件里根本没有官方 host，所以默认值等于不生效）。
        #    置 `always` = "用下面配置的 registry 覆盖锁文件里的 host"，**不重写锁文件**。
        #
        #    🛑 与本文件 android job 的 gradle 源改写是**同一族**处理，理由同一句：
        #       仓库保留镜像供中国开发者（本机路径已实测），CI 侧显式归一。
        env:
          npm_config_registry: https://registry.npmjs.org/
          npm_config_replace_registry_host: always
        run: |
          (cd admin-web && npm ci)
          (cd therapist-app && npm ci)

      # 契约一致性（一次校验三端：15 / 29 / 39 ops 与裁剪契约逐字一致）
      - name: 契约一致性
        working-directory: skeleton/frontends/admin-web
        run: npm run check:contract

      # 端 A / 端 B：结构 + 契约 + 真实构建（tsc --noEmit + vite build）
      #            + 端级强判据（check:a = 端点可达性 / 必需参数 / 未完结面；check:x3 = 角色可达性）
      #            + 行为测试（vitest）
      - name: 端 A admin-web 全门禁 + 测试
        working-directory: skeleton/frontends/admin-web
        run: |
          npm run check:build
          npm run check:a
          npm test
      - name: 端 B therapist-app 全门禁 + 测试
        working-directory: skeleton/frontends/therapist-app
        run: |
          npm run check:build
          npm run check:x3
          npm test

      # 端 C：小程序工程自检（产物由微信开发者工具编译）+ node 侧行为测试（零依赖 node --test）
      - name: 端 C client-mp 自检 + 测试
        working-directory: skeleton/frontends/client-mp
        run: |
          npm run build
          npm test

      # 端 D：原生 Android（Kotlin）——结构门禁（纯 Node，零依赖）
      # 🛑 与真实构建**刻意分离**：门禁只读「源码 + 生成物 + 契约」，不依赖
      #    Android SDK / emulator / JDK。这样"契约漂移 / 端点漏接 / 协议字面量 /
      #    响应 DTO 与契约 schema 不一致 / 图标资源缺失 / R8 会抹掉 Gson 裸字段 /
      #    targetSdk ≥ 35 强制边到边却没处理 inset"这类问题不必等到装了 SDK
      #    才暴露（见下方 android job 的对照）。
      - name: 端 D therapist-android 门禁
        working-directory: skeleton/frontends
        run: node tools/android-check.mjs

      # 门禁有牙齿的反向验证：注入故障必须被逐一抓住（含还原校验）。
      # 🛑 必须【串行】：这些脚本对同一批文件做「注入 → 还原」，并行会互相踩踏。
      - name: 门禁反向验证（build 29/29 · a 21/21 · x3 17/17 · android 43/43）
        working-directory: skeleton/frontends/admin-web
        run: |
          node ../tools/build-reverse-check.mjs
          node ../tools/a-reverse-check.mjs
          node ../tools/x3-reverse-check.mjs
          node ../tools/android-reverse-check.mjs

  android:
    name: 端 D 原生 Android 真编译 + 出包（Kotlin → APK）
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # 🛑 CI 第二轮实测（run 37798224165，2026-10-08）：android-actions/setup-android@v3
      #    内部执行 `sdkmanager tools`，而遗留的 'tools' 包已从 SDK 仓库移除
      #    （日志逐字：`Warning: Failed to find package 'tools'`）⇒ exit 1 ⇒ job 红。
      #    这是该 action 遇上较新 runner 镜像（cmdline-tools 16.0）后的已知失效。
      #    ubuntu-latest 镜像本就预装 Android SDK（ANDROID_HOME 已配好、sdkmanager 在
      #    PATH 上），本步骤在此已无存在价值；"不依赖镜像恰好预装"的确定性意图由
      #    下一步的显式 `sdkmanager --install` 继续承担（compileSdk=36 仍被钉死）。
      - name: 安装 SDK 组件（platform-36 / build-tools）
        run: |
          # 🛑 CI 第三轮实测（run 37800030929）：sdkmanager 并**不在** runner 的 PATH 上
          #    （exit 127 `sdkmanager: command not found`）—— 之前是 setup-android@v3
          #    这个 action 负责把它放进 PATH，删掉该 action 后这一隐式依赖露了出来
          #    （第 48 条：删一个步骤 = 删掉它顺手提供的全部环境）。
          #    ubuntu-latest 镜像预装的 SDK 目录一定在 $ANDROID_HOME 下，用绝对路径
          #    定位；cmdline-tools 的版本目录名会变（本镜像实测是 16.0 不是 latest），
          #    故 latest 不在就 glob 兜底。
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          fi
          echo "sdkmanager = $SDKM"
          test -x "$SDKM"
          # 许可证一并显式接受：不赌镜像是否预接受过 platform-36 的许可证。
          yes | "$SDKM" --licenses >/dev/null
          "$SDKM" --install "platforms;android-36" "build-tools;35.0.0"

      # 🛑 必须补可执行位：本工程在 Windows 上开发，而 git 在 Windows 上默认
      #    `core.filemode=false` ⇒ `gradlew` 的 +x 不会被记进版本库，
      #    Linux runner checkout 后它是**不可执行**的（报 Permission denied）。
      - name: 补 gradlew 可执行位
        run: chmod +x skeleton/frontends/therapist-android/gradlew

      # 🛑 这里**刻意只跑 debug**，不跑 assembleRelease：
      #    release 需要签名（四个 dy.store* 属性），而签名密钥**不应**放进 CI ——
      #    仓库里没有 keystore，CI 也不配。缺签名时 `assembleRelease` 会被
      #    `app/build.gradle.kts` 末尾的闸门**当场拦下**（见 README 第六节第 1 条），
      #    所以在 CI 上加这一步只会稳定报红、没有任何信息量。
      #    要核验 release 链路，请在有密钥的机器上按 README 的步骤跑一次。

      # 🛑 第 79 条：与 frontend job 的 npm 源归一**同族、同理由**。
      #    仓库里的 `gradle-wrapper.properties` 把 distributionUrl 指向
      #    `mirrors.cloud.tencent.com`（为中国网络优化，本机实测 0.11s 命中），
      #    但 runner 在境外，而**那是第三方 CDN**、可用性不由我们控制 ⇒ 一旦它慢或挂，
      #    "端 D 真编译"就会红在一个与代码毫无关系的地方。
      #
      #    🛑 Gradle wrapper **没有**官方 env 覆盖钩子（不像 npm 有 replace-registry-host），
      #       `distributionUrl` 只从这一份 properties 里读 ⇒ 只能显式改写 runner 上的这一份。
      #       仓库里的默认值**不动**（本机路径不受影响）。
      #
      #    🛑 改写结果必须**打进日志**：否则第一次红的时候，"到底用了哪个源"
      #       只能靠猜（第 24 条族：报错必须指向真因）。
      - name: 依赖源归一（Gradle 发行版：镜像 → 官方，仅 runner 内生效）
        working-directory: skeleton/frontends/therapist-android
        run: |
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          echo "--- runner 上实际使用的 distributionUrl ---"
          grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties

      # 注入一个显式基址，证明「构建期注入 → BuildConfig」这条链路真的通。
      # 用 RFC 2606 保留域名 .invalid，明确表达它不是真实可达地址 ——
      # debug 包不校验 HTTPS，故这里不需要真地址（生产基址由发布流程注入）。
      - name: Assemble debug（真编译出包）
        working-directory: skeleton/frontends/therapist-android
        run: ./gradlew --no-daemon -Pdy.apiBaseUrl=https://ci.invalid assembleDebug
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: therapist-android-debug-apk
          path: skeleton/frontends/therapist-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  docker:
    name: 镜像可构建性（不推送）
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build image (验证 Dockerfile 可用)
        working-directory: skeleton
        run: docker build -t diaoyuanyun-app:ci --target run .
