name: build-and-test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

# 防止并发重复构建同一 ref
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 8 模块 clean install（含全量测试 + 码级门禁）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # 🛑 本 job 必须有 Python，且必须带 PyYAML —— 不是"顺手装一个"，是两处硬依赖：
      #    ① `mvn clean install` 在 **validate** 阶段就跑若干 Python 门禁
      #       （根 pom.xml 的 s16 / s18 / s19 exec 门禁 + ADR-12 词表扫描）；
      #    ② 这些门禁**刻意**要求一个真正的 YAML 解析器（实测两个手写正则探针在同一份
      #       契约上互相矛盾，42 vs 2 个字段），缺 PyYAML 一律 **exit 2**，
      #       **不会**退化成正则后照常打印 PASS。
      #    ⇒ 此前本 job 一个 Python 步骤都没有，在干净 runner 上**必然红**，
      #      而且红的措辞会把排查引向"契约不一致"这个完全错误的方向。
      #    另：裸 ubuntu-latest 上 `python` 未必存在（通常只有 `python3`），
      #    而根 pom.xml 的 `compliance.python.executable` 默认值**就是** `python`
      #    ⇒ 不 setup-python 还会额外撞上"找不到命令"。setup-python 会同时提供
      #    `python` 与 `python3` 两个入口。
      #    参照：`.github/workflows/compliance-gate.yml` 一直有这一步，本文件此前漏了。
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the gates' YAML parser
        run: python -m pip install --disable-pip-version-check -r skeleton/requirements.txt
      - name: Build & test (clean install)
        working-directory: skeleton
        run: mvn -B -ntp clean install
      # 真库校验 / 反向验证脚本（如有 Postgres 服务可在此接）
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: skeleton/**/target/surefire-reports/*.txt

  frontend:
    name: 三端前端工程自检 + 行为测试 + 反向验证
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 🛑 与 backend job 同因：端 C 的 `npm run build`
      #    （tools/build-check.mjs --end=client-mp）会调
      #    `gen-endpoints.py --check` 校验"契约改了但端点层没重跑"，
      #    而生成器缺 PyYAML 时 exit 2 ⇒ 本 job 也会红。
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the gates' YAML parser
        run: python -m pip install --disable-pip-version-check -r skeleton/requirements.txt

      - name: 安装端 A / 端 B 依赖
        working-directory: skeleton/frontends
        run: |
          (cd admin-web && npm ci)
          (cd therapist-app && npm ci)

      # 契约一致性（一次校验三端：15 / 29 / 39 ops 与裁剪契约逐字一致）
      - name: 契约一致性
        working-directory: skeleton/frontends/admin-web
        run: npm run check:contract

      # 端 A / 端 B：结构 + 契约 + 真实构建（tsc --noEmit + vite build）
      #            + 端级强判据（check:a = 端点可达性 / 必需参数 / 未完结面；check:x3 = 角色可达性）
      #            + 行为测试（vitest）
      - name: 端 A admin-web 全门禁 + 测试
        working-directory: skeleton/frontends/admin-web
        run: |
          npm run check:build
          npm run check:a
          npm test
      - name: 端 B therapist-app 全门禁 + 测试
        working-directory: skeleton/frontends/therapist-app
        run: |
          npm run check:build
          npm run check:x3
          npm test

      # 端 C：小程序工程自检（产物由微信开发者工具编译）+ node 侧行为测试（零依赖 node --test）
      - name: 端 C client-mp 自检 + 测试
        working-directory: skeleton/frontends/client-mp
        run: |
          npm run build
          npm test

      # 端 D：原生 Android（Kotlin）——结构门禁（纯 Node，零依赖）
      # 🛑 与真实构建**刻意分离**：门禁只读「源码 + 生成物 + 契约」，不依赖
      #    Android SDK / emulator / JDK。这样"契约漂移 / 端点漏接 / 协议字面量 /
      #    响应 DTO 与契约 schema 不一致 / 图标资源缺失 / R8 会抹掉 Gson 裸字段 /
      #    targetSdk ≥ 35 强制边到边却没处理 inset"这类问题不必等到装了 SDK
      #    才暴露（见下方 android job 的对照）。
      - name: 端 D therapist-android 门禁
        working-directory: skeleton/frontends
        run: node tools/android-check.mjs

      # 门禁有牙齿的反向验证：注入故障必须被逐一抓住（含还原校验）。
      # 🛑 必须【串行】：这些脚本对同一批文件做「注入 → 还原」，并行会互相踩踏。
      - name: 门禁反向验证（build 26/26 · a 21/21 · x3 17/17 · android 43/43）
        working-directory: skeleton/frontends/admin-web
        run: |
          node ../tools/build-reverse-check.mjs
          node ../tools/a-reverse-check.mjs
          node ../tools/x3-reverse-check.mjs
          node ../tools/android-reverse-check.mjs

  android:
    name: 端 D 原生 Android 真编译 + 出包（Kotlin → APK）
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      # 🛑 显式装 SDK 组件，不依赖 runner 镜像恰好预装：
      #    镜像是会变的，而 `compileSdk=36` 是工程钉死的（见 app/build.gradle.kts）。
      #    让 AGP 自己"按需下载"会把构建成功与否交给网络，且失败信息很难懂。
      - name: 安装 SDK 组件（platform-36 / build-tools）
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      # 🛑 必须补可执行位：本工程在 Windows 上开发，而 git 在 Windows 上默认
      #    `core.filemode=false` ⇒ `gradlew` 的 +x 不会被记进版本库，
      #    Linux runner checkout 后它是**不可执行**的（报 Permission denied）。
      - name: 补 gradlew 可执行位
        run: chmod +x skeleton/frontends/therapist-android/gradlew

      # 🛑 这里**刻意只跑 debug**，不跑 assembleRelease：
      #    release 需要签名（四个 dy.store* 属性），而签名密钥**不应**放进 CI ——
      #    仓库里没有 keystore，CI 也不配。缺签名时 `assembleRelease` 会被
      #    `app/build.gradle.kts` 末尾的闸门**当场拦下**（见 README 第六节第 1 条），
      #    所以在 CI 上加这一步只会稳定报红、没有任何信息量。
      #    要核验 release 链路，请在有密钥的机器上按 README 的步骤跑一次。

      # 注入一个显式基址，证明「构建期注入 → BuildConfig」这条链路真的通。
      # 用 RFC 2606 保留域名 .invalid，明确表达它不是真实可达地址 ——
      # debug 包不校验 HTTPS，故这里不需要真地址（生产基址由发布流程注入）。
      - name: Assemble debug（真编译出包）
        working-directory: skeleton/frontends/therapist-android
        run: ./gradlew --no-daemon -Pdy.apiBaseUrl=https://ci.invalid assembleDebug
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: therapist-android-debug-apk
          path: skeleton/frontends/therapist-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  docker:
    name: 镜像可构建性（不推送）
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build image (验证 Dockerfile 可用)
        working-directory: skeleton
        run: docker build -t diaoyuanyun-app:ci --target run .
