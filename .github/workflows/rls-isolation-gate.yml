name: rls-isolation-gate

# ADR-02 L3 租户泄漏门禁：真库端到端 RLS 隔离验证。
#
# 为什么单独一个 workflow（而不是塞进 compliance-gate.yml / crypto-adversarial-gate.yml）
#   三者的"红"含义完全不同，混在一起会让一次红分不清是词表、加密还是隔离：
#     - compliance-gate            静态词表扫描（构建期，不需要数据库）
#     - crypto-adversarial-gate    加密实现的运行时行为（不需要数据库）
#     - 本 workflow                【租户隔离】这个安全属性的真库行为（必须有一个真 PG）
#   "分不清的红"会被整批跳过，所以每种语义各占一个 workflow，各自红/绿。
#
# 本 workflow 是 README §5.2「RLS 端到端集成测试进 CI」的落地（C-2）。
# 在此之前，真库 RLS 断言只在本机绿色通过过 —— 而"只在原作者机器上绿的验证"不是验证。
#
# 两条独立证据链（不同编写者 / 不同证据面，合起来才是"隔离成立"的充分证据）
#   step 1（实现者证据）：套件内门禁 `Rls*Test` —— 走 RlsGateSupport，
#                        逐个 \i 应用【被测交付物】里的真实迁移链，自建模块专属库。
#                        其中 RlsCoverageGateTest 还做三源交叉核对（迁移脚本 / 登记表 /
#                        真库 information_schema），把"每张新表无隔离测试即构建失败"
#                        从纪律变成构建期事实。
#   step 2（独立证据）：legacy psql 套件 99_b12_run.sh —— 纯 psql 驱动，
#                        与 Java 侧共用同一批 .sql 资产，但用【不同库、不同角色】，
#                        并额外证明"整条迁移链连跑 2 次幂等"。
#   step 3（负控自检）：**本 workflow 自身的接线证明** —— 见下。
#
# 🛑 step 3 为什么必须存在（否则 step 1/2 的绿是可疑的）
#   step 1/2 都靠 `FORCE ROW LEVEL SECURITY` 生效才可能变红。若某次改动让
#   FORCE 悄悄失效（例如 owner 被换成超级用户、或迁移里漏了 FORCE），
#   隔离断言会【假通过】—— 而假通过的门禁比没有门禁更危险，因为它给出虚假保证。
#   故本 workflow 主动把 FORCE 关掉一次，断言"隔离套件必须因此变红"。
#   变红了才证明门禁是承重的；没变红说明门禁早已失效，job 直接失败。
#   这是 C-2 从 crypto-adversarial-gate 的"独立探针自证门禁有牙齿"学来的同一条纪律。
#
# 前提（本地已实测坐实，非推断）
#   - `mvn -pl dy-app -am test`（**不带 `-Dtest` 筛选**）→ 全绿（真 PG）。
#     🛑 2026-09-30 修正：本行原写 `-Dtest='Rls*Test' -DfailIfNoTests=false`，
#     该写法在本仓**结构上不可能通过**（dy-config 的 config-truth-source-gate 把
#     `<failIfNoTests>true</failIfNoTests>` 写死在 pom 里，CLI 属性盖不住它；
#     `-am` 必然带上 dy-config ⇒ 筛掉它的 IT 就必红）。详见 step 1 的注释。
#   - `bash verification/99_b12_run.sh` → exit 0
#   - 015_apply.sql 已由 C-2 改为双通道路径（-v v1 优先 / \ir 相对兜底），
#     原"硬编码 'C:/Users/lenovo/...'"已被移除 —— 那正是它此前无法在 CI 上跑的原因。
#
# 说明（2026-09-30 更新）：仓库【已是 git 仓库】，根目录 = product-strategy/，
# 本文件位于仓库根的 .github/workflows/。仍未接远端，故尚未在 GitHub 上运行；
# 接入后须在 Settings 里把本 job 配为 required status check，否则拦不住合并。
# 接入后的剩余人工动作：在仓库设置里把本 job 设为 required check（工作流无法自行阻断合并）。

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rls-isolation:
    name: RLS tenant isolation (ADR-02 L3 gate)
    runs-on: ubuntu-latest
    # 🛑 2026-09-30 新增：仓库根已上移到 product-strategy/，Maven 工程在 skeleton/。
    #   本文件原在 skeleton/.github/ 下（那时 cwd 恰为 skeleton），移至仓库根后
    #   必须显式声明工作目录 —— 既是路径问题，也是本 workflow 的【正确性前提】：
    #   ContractConsistencyTest 等 7 个门禁测试类会从 cwd 逐级向上找"仓库根"
    #   （= 含 _work/ 与 PRD 的那层，即 product-strategy）。cwd=skeleton 时
    #   层级 1 恰好命中；若 cwd 变成仓库根，层级 0 即命中 —— 两种情况都对，
    #   而【仓库建在 skeleton/ 且 clone 到别处】才是会红的那种（见第 49 条缺陷）。
    defaults:
      run:
        working-directory: skeleton
    # 真 PG。选 16（与本地 17 同属受支持的主版本；RlsGateSupport.psqlExecutable()
    # 的候选里已含 /usr/bin/psql 与 PATH 回退，故 CI 上无需改任何 Java）。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    # 三个环境变量即 RlsGateSupport / 99_b12_run.sh 共同认的连接口径。
    # 缺 DY_PG_SUPER_PASSWORD 时它们会回落到 "postgres"，但显式给出来是为了
    # 让"CI 用的是哪个口令"在 workflow 里可见，而不是藏在 Java 的默认值里。
    env:
      DY_PG_HOST: 127.0.0.1
      DY_PG_PORT: "5432"
      DY_PG_SUPER_PASSWORD: postgres
      # 每次 CI 都从零重建门禁库：CI 是一次性环境，没有"复用上一版库"的价值，
      # 而重建能顺带证明"整条迁移链能在空库上建起来"。
      DY_TESTDB_RESET: "1"
      # 显式钉住解释器文本编码（同另两个 workflow 的理由）：
      # 日志里的中文一旦乱码，真失败会变得不可读，而不可读的失败会被关掉。
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # psql 是 step 2/3 的硬前提（99_b12_run.sh 与负控都直接调 psql）。
      # 先探测、缺了才装 —— 免得为了一个通常已存在的二进制白等一次 apt。
      - name: Ensure the psql client is available
        run: |
          if command -v psql >/dev/null 2>&1; then
            echo "psql already present: $(psql --version)"
          else
            sudo apt-get update
            sudo apt-get install -y postgresql-client
            psql --version
          fi

      # step 1 —— 实现者证据。
      # 🛑🛑 2026-09-30 修正（本命令此前是【错的】，会让本 workflow 恒红）。
      #    旧写法 `-Dtest='Rls*Test' -DfailIfNoTests=false` 在本仓【结构上不可能通过】，
      #    已由本机实测逐字复现（exit≠0，连续三次不同写法全部失败）：
      #      (a) `-Dtest` 筛选"无匹配"时，surefire 3.2.5 对 **default-test** 报的是
      #          `Set -Dsurefire.failIfNoSpecifiedTests=false to ignore this error.`
      #          ⇒ 旧属性名 `-DfailIfNoTests=false` 对它**不生效**；
      #      (b) 更关键的**硬阻塞**：`dy-config/pom.xml` 的
      #          **config-truth-source-gate** execution 把
      #          `<failIfNoTests>true</failIfNoTests>` **写死在 pom 里**，
      #          它是「配置真相源门禁必须被执行」的设计意图（见该 pom 注释）。
      #          plugin 配置值**优先于**同名用户属性 ⇒ CLI 传 `-DfailIfNoTests=false`
      #          **盖不住它**（实测：两个属性全传、或改用 `-Ddy.config.gate.skip=true`
      #          逃生阀，dy-config 仍以 `No tests were executed!` FAILURE）。
      #          `-am` 必然把 dy-config 带上 ⇒ 只要筛掉它的三个 IT，这一关必红。
      #    ⇒ 唯一可行正解 = **不带 `-Dtest` 全量跑**（筛选 `Rls*Test` 会连带
      #      `-am` 的全部模块，而那正是它与 pom 硬门禁冲突的地方）。
      #      本机实测 `mvn -o -B -ntp -pl dy-app -am test`：**9 模块全 SUCCESS**，
      #      `rls-isolation-gate` 110 例照常执行（`Tests run: 110` 逐字）。
      #      附带收益：这条命令与「全量回归」是**同一条**，CI 与本地不再有两套口径。
      - name: Suite gates -- real-DB RLS isolation (implementer evidence)
        env:
          MAVEN_OPTS: -Dfile.encoding=UTF-8
        run: |
          mvn -B -pl dy-app -am test

      # step 2 —— 独立证据。
      # 退出码语义：0=全通过；非 0=某步失败（该脚本不吞错、不静默降级）。
      - name: Legacy psql suite -- chain idempotency + isolation (independent evidence)
        run: bash verification/99_b12_run.sh

      # step 3 —— 负控自检：证明本 workflow 的隔离断言【真的承重】。
      # 🛑 这是本 workflow 最重要的一步。它不测产品代码，测的是"门禁本身还有没有牙齿"。
      - name: Negative control -- the isolation gate must actually catch a leak
        run: |
          set -u -o pipefail
          DB=diaoyuanyun_rls_test_b12
          APPUSER=dy_app_b12
          APPPW=dy_app_b12_local_2026

          echo "== 负控前置：关掉 FORCE 之前，隔离套件必须【通过】 =="
          if ! PGPASSWORD="$APPPW" psql -X -h "$DY_PG_HOST" -p "$DY_PG_PORT" \
                 -U "$APPUSER" -d "$DB" -v ON_ERROR_STOP=1 -q \
                 -f verification/03_assert.sql >/dev/null 2>&1; then
            echo "🛑 负控前提不成立：FORCE 尚在时隔离套件就没通过 —— 先修主门禁，再谈负控"
            exit 1
          fi
          echo "  基线 OK：FORCE 生效时隔离套件通过"

          echo "== 注入：把 customer 的 FORCE ROW LEVEL SECURITY 关掉 =="
          PGPASSWORD="$DY_PG_SUPER_PASSWORD" psql -X -h "$DY_PG_HOST" -p "$DY_PG_PORT" \
            -U postgres -d "$DB" -v ON_ERROR_STOP=1 -q \
            -c "ALTER TABLE customer NO FORCE ROW LEVEL SECURITY;"
          echo "  已注入：customer 现为 NO FORCE（owner 将绕过策略）"

          echo "== 断言：隔离套件此刻【必须失败】 =="
          if PGPASSWORD="$APPPW" psql -X -h "$DY_PG_HOST" -p "$DY_PG_PORT" \
               -U "$APPUSER" -d "$DB" -v ON_ERROR_STOP=1 -q \
               -f verification/03_assert.sql >/dev/null 2>&1; then
            echo "🛑 负控失败：FORCE 已关，隔离套件却仍然通过 ——"
            echo "   这说明隔离断言【根本没在测 FORCE RLS】，其全绿是假通过。"
            echo "   假通过的门禁比没有门禁更危险（它给出虚假保证）⇒ 本次 job 判红。"
            exit 1
          fi
          echo "✔ 负控通过：FORCE 一关，隔离断言立刻变红 ⇒ 门禁是承重的"

          echo "== 还原（不改工作区文件，只把库改回 FORCE 态） =="
          PGPASSWORD="$DY_PG_SUPER_PASSWORD" psql -X -h "$DY_PG_HOST" -p "$DY_PG_PORT" \
            -U postgres -d "$DB" -v ON_ERROR_STOP=1 -q \
            -c "ALTER TABLE customer FORCE ROW LEVEL SECURITY;"
          echo "  已还原 FORCE"

      - name: Publish the gate conclusion to the job summary
        if: always()
        run: |
          {
            echo '## RLS tenant isolation gate (ADR-02 L3)'
            echo ''
            echo '| step | 证据面 | 说明 |'
            echo '|---|---|---|'
            echo '| 1 | 套件内门禁 `Rls*Test` | 实现者证据：走真实迁移链 + 三源交叉核对 |'
            echo '| 2 | `verification/99_b12_run.sh` | 独立证据：纯 psql + 链幂等 |'
            echo '| 3 | 负控自检 | 证明隔离断言真的在测 FORCE RLS，而非假通过 |'
            echo ''
            echo '> `015_apply.sql` 的路径已由 C-2 改为双通道（`-v v1` 优先 / `\ir` 相对兜底），'
            echo '> 原硬编码绝对路径已移除 —— 这是本 workflow 能在任意检出路径上运行的前提。'
          } >> "$GITHUB_STEP_SUMMARY"