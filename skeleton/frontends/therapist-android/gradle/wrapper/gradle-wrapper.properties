# ============================================================================
# 端 B · 调理师 / 经络师 APP（原生 Android）—— Gradle 发行版锁定
# ============================================================================
#
# 🛑 为什么 distributionUrl 指向腾讯云镜像，而不是官方源
# ---------------------------------------------------------------------------
# 本机在中国大陆，国内 CDN 首次下载明显更快。
#
# ⚠️ 这条理由经过一次复测修正（完整记录见 settings.gradle.kts 的「仓库顺序说明」）
# ---------------------------------------------------------------------------
#   · 更早一轮实测：官方 services.gradle.org **不通** —— 当时的理由是"唯一可达"。
#   · 2026-10-08 复测：官方源已可达（307 重定向后 200），腾讯镜像亦 200。
#   ⇒ 理由改为"速度优先"，而不再是"唯一可达"。
#   教训：不要把某一次网络实测结论当成永久事实（这条本身踩过一次）。
#
# 🛑 想改走官方源的话
# ---------------------------------------------------------------------------
# 把下一行换成：
#   distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
# 但 **版本号 9.3.1 不得改** —— 本工程的 AGP 8.12.0 / Kotlin 2.1.20 是与
# Gradle 9.3.1 **一起验证过的一个组合**，单改 Gradle 版本必须重跑完整构建复验
# （见 README 第二节的"本机实测工具链组合"）。
#
# ⚠️ 改 URL 会导致 wrapper 重新下载发行版（缓存目录按 URL 的哈希分桶）。
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
