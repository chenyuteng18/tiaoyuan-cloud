# ============================================================================
# 端 B · 调理师 / 经络师 APP（原生 Android）—— Gradle 全局配置
# ============================================================================

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 🛑 串行、关守护，不用配置缓存 —— 三条都不是"保守"，各有实测理由：
#   · parallel=false      ：单模块工程并行无收益，且并行会让构建日志交错，
#                           门禁脚本按行解析日志时会互相干扰（本仓第 62 条：
#                           判据不得依赖与代码无关的环境状态）。
#   · configuration-cache ：AGP 8.12 支持它，但开启后 `-P` 属性变化会触发
#                           缓存失效重算，让"同一命令两次结果不一致"，
#                           干扰反向验证的还原断言。
org.gradle.parallel=false
org.gradle.configuration-cache=false
org.gradle.caching=false

# AndroidX 与 R 类（AGP 8 默认值，显式写出以免默认值变更时静默漂移）
android.useAndroidX=true
android.nonTransitiveRClass=true

# 默认不启用 Jetifier（本项目无 support-library 遗留依赖）
android.enableJetifier=false

# ---------------------------------------------------------------------------
# 后端基址（fail-closed：缺失即**运行期启动失败**，绝不回落到"大概是联调地址"）
# ---------------------------------------------------------------------------
# 取值优先级：-Pdy.apiBaseUrl=… > 环境变量 DY_API_BASE_URL > （空 ⇒ 启动即抛错）
#
# 🛑 为什么默认留空而不是给一个默认值
# ---------------------------------------------------------------------------
# 与端 A / 端 B（Web）的 `VITE_API_BASE_URL` 纪律**逐字一致**：
# 回落会让一次配错的部署看上去正常，直到有人发现数据写到了错误的库。
# 本端把这个判断放在 `AppEnv` 启动检查里，故意的 ——
# 让"忘记配基址"在第一次启动时就炸出来，而不是在第一次下单时。
#
# 本机联调示例（不要写进版本库）：
#   ./gradlew -Pdy.apiBaseUrl=http://10.0.2.2:18080 assembleDebug
#   （10.0.2.2 是 Android 模拟器访问宿主机 127.0.0.1 的固定地址）
