# ============================================================================
# 调元云 · 生产 Nginx（TLS 终结 + 反向代理）
#
# 三条安全底线：
#   1. HTTP 只做 301 跳 HTTPS —— 业务流量全程 TLS
#   2. 后端上游只在 compose 内网（app:8080），宿主机无直连面
#   3. 证书路径挂载只读（见 docker-compose.prod.yml volumes）
# ============================================================================

# 限流区：登录端点按 IP 限流（防凭证爆破的第一道闸，配合应用层统一 401 文案）
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

upstream diaoyuanyun_app {
    server app:8080;
    # 单机起步单实例；扩副本时改:
    #   server app:8080; server app2:8080;
    # 并将幂等后端确认在 redis（prod 下 memory 会被启动自检拒绝）
    keepalive 32;
}

# 80: 仅做跳转与 ACME 挑战（证书续期）
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    # 安全响应头（HSTS 启用前提：确认证书链稳定后再放开 max-age）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # add_header Strict-Transport-Security "max-age=15552000" always;

    # 请求体上限：与后端 multipart 12MB 对齐并留信封余量
    client_max_body_size 13m;

    # 登录端点限流（10 r/min/IP —— 正常单人登录频率远低于此）
    location = /api/v1/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://diaoyuanyun_app;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    location / {
        proxy_pass http://diaoyuanyun_app;
        include /etc/nginx/conf.d/proxy_common.inc;
    }
}
