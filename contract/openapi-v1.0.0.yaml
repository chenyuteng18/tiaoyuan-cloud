      x-callable-roles: []
      x-client-forbidden: true
      x-frontier: 占位待冻结
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 渲染结果（rendered_snapshot + rendered_hash）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultEnvelope' }
        '403': { $ref: '#/components/responses/PlaceholderOutOfScope' }

# =============================================================================
# 组件
# =============================================================================
components:

  parameters:
    CustomerId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: 客户 ID（服务端从 token 校验租户归属）
    DocTemplateId:
      name: id
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1 }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, maximum: 100 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: 服务端在 24h 窗口内去重

  responses:
    ValidationFailed:
      description: 400 VALIDATION_FAILED（参数类型/必填/约束不满足）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ResultEnvelope' }
    Unauthenticated:
      description: 401 UNAUTHENTICATED（无 token / token 过期）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ResultEnvelope' }
    VisibilityDenied:
      description: 403 VISIBILITY_DENIED（该角色对请求字段组无可见性档位；data.denied_fields 回显被拒字段名）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ResultEnvelope' }
    GateMissing:
      description: 403 GATE_MISSING（前置门禁缺失；data.missing_items[] 给出缺失项名称，不得模糊报错）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ResultEnvelope' }
    TenantMismatch:
      description: 403 TENANT_MISMATCH（跨租户访问 / 租户头与 token 不符）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ResultEnvelope' }
    PlaceholderOutOfScope:
      description: 403/2004 PLACEHOLDER_OUT_OF_SCOPE（模板含未在白名单的占位符）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ResultEnvelope' }
    NotFound:
      description: 404 NOT_FOUND（仅限本租户内确实不存在）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ResultEnvelope' }
    VersionConflict:
      description: 409 VERSION_CONFLICT（版本不可覆盖）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ResultEnvelope' }
    IdempotentReplay:
      description: 409 IDEMPOTENT_REPLAY（幂等键命中已有记录，返回首次结果）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ResultEnvelope' }
    BusinessRuleViolated:
      description: 422 BUSINESS_RULE_VIOLATED（业务规则不满足，如题组量程 ≠ 0–4）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ResultEnvelope' }
    RateLimited:
      description: 429 RATE_LIMITED（触发节流，如 onShow 5 分钟窗口）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ResultEnvelope' }
    InternalError:
      description: 500 INTERNAL_ERROR
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ResultEnvelope' }

  schemas:

    # ---------------------------------------------------------------
    # 统一信封（契约 §2.0）：{ code, message, data, trace_id }
    # code != 0 时 data 为空
    # ---------------------------------------------------------------
    ResultEnvelope:
      type: object
      required: [code, message, trace_id]
      properties:
        code:
          type: integer
          description: 0 = 成功；非 0 见 x-error-codes
        message:
          type: string
          description: 面向开发者，不得直接渲染给客户（客户端有自己的 code → copy 映射）
        data:
          type: object
          nullable: true
          description: code != 0 时为空
        trace_id:
          type: string
          x-visible-to: [client, therapist, meridian, admin]
      x-visibility-note: 信封字段对全部角色可见

    LoginData:
      type: object
      properties:
        token: { type: string, x-visible-to: [client, therapist, meridian, admin] }
        expires_in: { type: integer, x-visible-to: [client, therapist, meridian, admin] }
        role:
          type: string
          enum: [client, therapist, meridian, manager, area, hq]
          x-visible-to: [client, therapist, meridian, admin]
          description: 客户=client / 调理师=therapist / 经络师=meridian / 门店负责人=manager / 区域督导=area / 总部运营=hq
        client_end: { type: string, enum: [mp, app, web], x-visible-to: [client, therapist, meridian, admin] }
        tenant_id: { type: string, x-visible-to: [client, therapist, meridian, admin] }
        staff_id:
          type: string
          x-visible-to: [therapist, meridian, admin]
          description: 客户无 staff_id（差异项）

    AuthMeData:
      type: object
      properties:
        role: { type: string, x-visible-to: [client, therapist, meridian, admin] }
        band_visibility:
          type: object
          description: 字段组档位布尔值（声明，不是数据）
          properties:
            field_group_1_raw: { type: boolean, x-visible-to: [client, therapist, meridian, admin] }
            field_group_2_status: { type: boolean, x-visible-to: [client, therapist, meridian, admin] }
            field_group_3_gap_reason: { type: boolean, x-visible-to: [client, therapist, meridian, admin] }
            field_group_4_derived: { type: boolean, x-visible-to: [client, therapist, meridian, admin] }
        refund_visibility:
          type: boolean
          x-visible-to: [meridian, admin]
          description: 调理师 false（config #40）；客户恒 false
        store_scope:
          type: object
          x-visible-to: [therapist, meridian, admin]
          properties:
            row_level: { type: string, enum: [own_store, region, all] }
            store_ids: { type: array, items: { type: string } }

    StoreListData:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Store' } }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }

    Store:
      type: object
      properties:
        store_id: { type: string }
        name: { type: string }
        franchise_type: { type: string, enum: [直营, 加盟] }

    ScreeningCreateRequest:
      type: object
      required: [customer_id, items_json, operator_id]
      properties:
        customer_id: { type: string }
        items_json:
          type: object
          description: 含 pregnancy / acute / risk_history / nonmedical_disclosed
        operator_id: { type: string, description: 服务端从 token 覆写 }
        customer_sign: { type: string }
        operator_sign: { type: string }

    ScreeningData:
      type: object
      properties:
        screening_id: { type: string, x-visible-to: [client, therapist, meridian, admin] }
        result:
          type: string
          enum: [通过, 不通过]
          x-visible-to: [client, therapist, meridian, admin]
        submitted_at: { type: string, format: date-time, x-visible-to: [client, therapist, meridian, admin] }

    CustomerCreateRequest:
      type: object
      required: [name, gender, age, phone, screening_id]
      properties:
        name: { type: string }
        gender: { type: string, enum: [男, 女] }
        age: { type: integer, minimum: 1, maximum: 119 }
        phone: { type: string, description: 租户内唯一（跨店识别键）}
        screening_id: { type: string, description: 服务端校验其 result=通过 }

    CustomerCreateData:
      type: object
      properties:
        customer_id: { type: string, x-visible-to: [client, therapist, meridian, admin] }
        status:
          type: string
          enum: [CREATED, PROFILED, CONSENTED, REJECTED, ARCHIVED]
          x-visible-to: [client, therapist, meridian, admin]
          description: 5 值粗粒度派生聚合态，不是服务主状态机（14 态见 customer_state_transition）
        owner_store_id:
          type: string
          x-visible-to: [therapist, meridian, admin]
          description: 客户不下发
        serving_store_id:
          type: string
          x-visible-to: [therapist, meridian, admin]
          description: 客户不下发

    CustomerDetailData:
      type: object
      properties:
        customer_id: { type: string, x-visible-to: [client, therapist, meridian, admin] }
        name: { type: string, x-visible-to: [client, therapist, meridian, admin] }
        gender: { type: string, x-visible-to: [client, therapist, meridian, admin] }
        age: { type: integer, x-visible-to: [client, therapist, meridian, admin] }
        intake_profile: { type: object, x-visible-to: [client, therapist, meridian, admin] }
        screening_result: { type: string, x-visible-to: [client, therapist, meridian, admin] }
        band_willingness:
          type: string
          enum: [自愿佩戴, 暂不佩戴]
          x-visible-to: [client, therapist, meridian, admin]
        owner_store_id: { type: string, x-visible-to: [therapist, meridian, admin] }
        serving_store_id: { type: string, x-visible-to: [therapist, meridian, admin] }
        effect_verdict:
          type: string
          x-field-group: derived_result
          x-visible-to: [therapist, meridian, admin]
          description: 派生字段；客户 token 请求 include=verdict → 403 VISIBILITY_DENIED
        as_value:
          type: number
          x-field-group: derived_result
          x-visible-to: [therapist, meridian, admin]
          description: 派生字段；客户恒不下发

    AgeGroup:
      type: string
      enum: [男16-32, 男33-40, 男41-48, 男49以上, 女14-28, 女29-35, 女36-42, 女43-49以上]

    Dimension:
      type: string
      enum: [体能精力, 面部气色肤质, 肩颈腰背筋骨, 睡眠质量, 记忆专注, 代谢体态消化, 情绪抗压与抵抗力]

    BaselineAssessmentRequest:
      type: object
      required: [scale_id, item_group_id, age_group_locked, dimension_scores, total_score, measure_operator]
      properties:
        scale_id: { type: string }
        item_group_id: { type: string, description: 同源题组锁定 }
        age_group_locked: { $ref: '#/components/schemas/AgeGroup' }
        dimension_scores:
          type: array
          minItems: 7
          maxItems: 7
          items: { type: integer, minimum: 0, maximum: 16 }
        total_score: { type: integer, minimum: 0, maximum: 112 }
        measure_operator: { type: string }

    BaselineAssessmentData:
      type: object
      properties:
        assessment_id: { type: string, x-visible-to: [client, therapist, meridian, admin] }
        assessed_at: { type: string, format: date-time, x-visible-to: [client, therapist, meridian, admin] }
        baseline_conclusion:
          type: object
          x-visible-to: [client, therapist, meridian, admin]
          properties:
            haozhuan: { type: string, enum: [好转, 稳定, 下降] }
        migratable:
          type: boolean
          x-visible-to: [therapist, meridian, admin]
          description: 客户不下发
        dimension_scores:
          type: array
          items: { type: integer }
          x-visible-to: [client, therapist, meridian, admin]
          description: 客户仅见本人填答维度

    DailyReportRequest:
      type: object
