      properties:
        device_id: { type: string, description: 客户级穿戴设备 ID（非门店调理设备）}
        customer_id: { type: string, description: 服务端从 token 校验归属 }
        batch_no: { type: string, format: uuid, description: 幂等键（Idempotency-Key 同值）}
        trigger:
          type: string
          enum: [on_show_cold, on_show_hot, checkin, daily_report, manual]
        state:
          type: string
          enum: [syncing, synced, sync_failed, no_data_today]
          description: 四态；客户端可见的 client_sync_state（不含"未佩戴"取值）
        synced_at: { type: string, format: date-time, description: 精确记录；客户端展示精确到日 }
        last_success_date: { type: string, format: date, description: state=synced 时必填 }
        fail_reason_class:
          type: string
          enum: [bt_off, unauthorized, connect_timeout, device_low_battery, occupied_by_vendor_app, platform_suspended, probe_out_of_window]
          x-visible-to: [client, therapist, meridian, admin]
          description: state=sync_failed 时必填；技术类，取值域内不得出现"未佩戴"语义
        next_action:
          type: string
          enum: [open_bluetooth, grant_permission, retry, none]
          x-visible-to: [client, therapist, meridian, admin]
          description: state=sync_failed 时必填（可执行下一步）；不得只给一句"同步失败"

