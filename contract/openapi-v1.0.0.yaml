openapi: 3.0.3

# =============================================================================
# 上医智养堂 · 三端接口契约（OpenAPI 3.0）—— S1-1 D3 硬闸门
#
# 唯一权威来源（人读版）: _work/contract-t6-api-freeze-2026-09-19.md
# 本文件 = 该规格的【机器可读落地件】。二者冲突时以人读版规格为准，
# 并由 ContractFreezeGateTest 的"契约正文 ↔ OpenAPI 行集互查"直接报红。
#
# 冻结范围（逐行清点）:
#   §2.1~§2.7 域 A~G = 34 行（A3 / B6 / C4 / D6 / E6 / F4 / G5）
#   §2.8 域 H（占位待冻结）  = 1 行
#   §2.9 域 I（占位待冻结）  = 8 行
#   合计 43 行；D5 一行含 3 个端点 ⇒ 端点总数 45。
#
# 🛑 三条硬约束（写进本文件的机械可校验形态）:
#   ① 可见性由服务端裁剪 —— 无权限字段【不下发】（不是 null、不是空串）；
#      本文件用 x-visibility 逐字段声明，并由字段组规则强制：
#      x-field-group ∈ {gap_reason, derived_result} ⇒ client 恒 false。
#   ② 客户端包内不得含"退款"字样 —— §2.7 全域标 x-client-forbidden: true。
#   ③ N / s / f 一律 TBD 占位 —— 只有 E5 的 retention_window_days
#      与 F4 的 f 相关字段可取值 TBD，其余接口不得出现 "TBD"。
# =============================================================================

info:
  title: 上医智养堂 · 三端接口契约（调元云）
  version: api-contract-v1.0.0
  description: |
    三端（客户小程序 / 调理师·经络师 APP / 管理员 Web）一次冻结的接口契约。

    版本号规则（语义化，与 info.version 同值）：
      - MAJOR（破坏级）：字段删除 / 改名 / 类型变更；可见性档位变更；枚举值语义变更；错误码语义变更；
        涉可见性档位的 MAJOR 变更须触发「变更业务裁定」（不得按"体验优化"处理）。
      - MINOR（兼容级）：新增可选请求字段 / 新增接口 / 新增响应字段。
      - PATCH（文档级）：注释 / 示例 / 措辞修正，不动字段与语义。

    🛑 措辞纪律：client_end=mp 可见字段不得含"退款""诊断"；同步时间精确到日。
  contact:
    name: 后端主程（技术单签）· 产品共签（可见性 / 措辞档位）
  license:
    name: Proprietary

servers:
  - url: /api/v1
    description: Base Path（契约 §2.0 全局约定）

tags:
  - name: A-租户与权限
    description: 登录 / 身份与可见性档位下发 / 门店列表
  - name: B-客户与档案
    description: 禁忌筛查 / 建档 / 同意书 / 档案详情 / 建档扩展档案
  - name: C-评估与题库
    description: 题库拉取 / 基线评估 / 周期评估
  - name: D-服务与履约
    description: 服务核销 / 每日填报 / 方案与审核 / 设备参数下发
  - name: E-设备与手环数据
    description: 同步批次四态 / 遥测上行 / 原始数据 / 派生结果 / 日期探测 / 同步状态卡
  - name: F-判定与稽核
    description: 判定结论落库 / 判定历史 / 稽核信号 / 可判定覆盖率
  - name: G-退款与挽留
    description: 代录诉求 / 工单详情 / 挽留 / 审批 / 回执（客户端与调理师端一律 403）
  - name: H-文书与电子签
    description: 厂商回调接收端点（占位 · 待厂商选定后冻结）
  - name: I-文书模板与渲染
    description: 模板列表 / 新建 / 上传 / 版本 / 发布 / 下载 / 签署时渲染（占位 · 字段未冻结）

# =============================================================================
# 全局约定（契约 §2.0）—— 以 x- 扩展声明，供门禁机械校验
# =============================================================================
x-global-conventions:
  base-path: /api/v1
  auth: "Authorization: Bearer <token>（token 内嵌 tenant_id / role / staff_id）"
  tenant-context: |
    服务端从 token 取 tenant_id；请求头 X-Tenant-Id 若存在必须与 token 一致，
    否则 403 TENANT_MISMATCH。跨租户资源一律 403（存储层直接拒绝，
    不返回 404 以避免存在性探测）。
  envelope: '{ "code": 0, "message": "ok", "data": {...}, "trace_id": "..." }'
  envelope-rule: code != 0 时 data 为空
  pagination: "请求 ?page=<int>&page_size=<int≤100>；响应 data.{items[], total, page, page_size}"
  visibility: 每个接口的响应字段按 x-visibility 矩阵在服务端裁剪；无权限字段不下发（不是 null、不是空串）
  forbidden-403: 「前置门禁缺失」与「可见性档位不足」统一返回 403，message 必须给出缺失项名称 / 档位名称（不得模糊报错）
  idempotency: 写接口接受 Idempotency-Key 请求头（UUID）；服务端在 24h 窗口内去重

# =============================================================================
# 跨端协议片段（第 57 条）—— 【结构化】声明
# =============================================================================
# 🛑 为什么必须另立结构化块，而不能只留上面 x-global-conventions 的 prose
# -----------------------------------------------------------------------------
# 上面 `auth` / `envelope` / `idempotency` 三行是**给人读的句子**：机器无法从
# 它们机械推导「出站该用哪个头名、令牌前缀是什么、成功码是几」。于是三端前端
# 各自把协议字面量手抄进代码：
#     headers.Authorization = `Bearer ${token}`      （端 A / 端 B）
#     header['Idempotency-Key'] = ...                （三端，写请求）
#     res.headers.get('X-Trace-Id')                  （端 A / 端 B）
#     body.code !== 0                                （三端）
# `X-Trace-Id` 连 prose 里都【没有】—— 它只活在后端 TraceIdFilter 的常量与前端
# 字面量里（共 6 处），契约全域零声明。契约改头名 ⇒ 各处静默分叉 ⇒
# 全量 401 / 幂等去重失效 / 留痕断链，而 tsc / vite / 全部门禁**全部仍绿**
# （它们从不发真实请求）。这与第 56 条的 Base Path 缺口同族：
# **契约写下的协议与各端拿到的协议是两件事，中间丢项不报错。**
#
# 故把"跨端共同遵守的协议片段"落成**可机械读取的结构化事实**；
# 生成器转录为生成物常量，三端出站层一律引用常量、不得再出现字面量
# （由 `tools/build-check.mjs` ④d `cross-end-protocol` 判据守住）。
# 与 prose 的冲突由 ContractFreezeGateTest 的互查断言报红 —— 两处都在、且一致。
x-api-protocol:
  auth-header: Authorization
  auth-scheme: Bearer
  tenant-header: X-Tenant-Id
  tenant-mismatch-invariant: X-Tenant-Id 若存在必须与 token 内 tenant_id 一致（仅校验、不采纳），否则 403 TENANT_MISMATCH；跨租户资源一律 403
  trace-header: X-Trace-Id
  idempotency-header: Idempotency-Key
  idempotency-window-hours: 24
  envelope-fields: [code, message, data, trace_id]
  envelope-ok-code: 0
  envelope-rule: code != 0 时 data 为空

# =============================================================================
# 字段组定义（契约 §3.1）—— 四组 × 五角色，与 config #43 / 原型 D1 逐格一致
# =============================================================================
x-field-groups:
  raw_data:
    name: ① 手环原始数据
    fields: 睡眠 / 步数 / 心率 / 静息心率 / 血氧 / 运动类型
  capture_status:
    name: ② 采集状态
    fields: 已采集天数 / 同步时间（synced_at，精确到日）/ 接入状态
  gap_reason:
    name: ③ 缺口原因分类
    fields: gap_reason
  derived_result:
    name: ④ 派生结果
    fields: 依从性维度分（含 A3）/ AS 值 / effect_verdict / 退款资格

# 四档 × 五角色（权威矩阵：与原型 D1 / config #43 / PRD §2.6.1 四源一致）
x-visibility-matrix:
  raw_data:
    client: true
    therapist: true
    meridian: true
    admin: true
    store_customer_service: false
  capture_status:
    client: true
    therapist: true
    meridian: true
    admin: true
    store_customer_service: false
  gap_reason:
    client: false
    therapist: true
    meridian: true
    admin: true
    store_customer_service: false
  derived_result:
    client: false
    therapist: true          # ⚠️ 可见，但不得作对客户不利依据
    meridian: true
    admin: true
    store_customer_service: false
  notes:
    - 门店客服无端（不使用系统）—— 该界面不成立，任何字段组均不成立
    - admin 档位另按行级 scope 收窄（本店 / 辖区 / 全量）
    - 客户侧 ③④ 为硬约束、不得通过配置放开 —— 放开属「变更业务裁定」

# =============================================================================
# 角色枚举 —— 五角色 × 六 token 角色值的映射（A1/A2 与 x-visibility 共用一套口径）
# =============================================================================
x-roles:
  client:
    token-role: client
    end: mp
    display: 客户（小程序）
  therapist:
    token-role: therapist
    end: app
    display: 调理师（APP）
  meridian:
    token-role: meridian
    end: app
    display: 经络师（APP）
  admin:
    token-role: [manager, area, hq]
    end: web
    display: 管理员（门店负责人 / 区域督导 / 总部运营）
  store_customer_service:
    token-role: null
    end: null
    display: 门店客服（无端，无任何接口）

# =============================================================================
# 措辞纪律（契约 §5.1 R1~R8）—— 机器可读词表，供 ADR-12 扫描与 OpenAPI lint 共用
# =============================================================================
x-wording-discipline:
  client-forbidden-terms: [退款, 诊断, 未佩戴, 缺失, 达标, 不达标, 无效退款, 概不退款]
  client-visible-naming-rules:
    R1: 客户可见字段名 / 枚举值不得含"退款"
    R2: 客户可见字段名 / 枚举值不得含"诊断"
    R3: 客户可见不出现派生结论（字段整体不下发）
    R4: 客户可见同步时间精确到日，不得到分秒
    R5: 客户可见正向计数 + 中性描述
    R6: 未接入态不得用 0 / 空图表 / 示例数据顶替
    R7: 客户可见不得出现"达标/未达标"评价
    R8: 派生结论侧禁用"不利"色 / 措辞
  namespace-isolation: 客户可见枚举以 client_* 前缀；内部枚举以 internal_* / 原名 —— 两套不得共用类型定义

# =============================================================================
# 默认响应（错误信封）
# =============================================================================
x-error-codes:
  - http: 400
    code: 1001
    name: VALIDATION_FAILED
    trigger: 参数类型 / 必填 / 约束不满足
  - http: 401
    code: 1002
    name: UNAUTHENTICATED
    trigger: 无 token / token 过期 / token 非法
  - http: 403
    code: 2001
    name: VISIBILITY_DENIED
    trigger: 该角色对请求字段组无可见性档位（服务端裁剪，非前端不渲染）
  - http: 403
    code: 2002
    name: GATE_MISSING
    trigger: 前置门禁缺失（data.missing_items 给出缺失项名）
  - http: 403
    code: 2003
    name: TENANT_MISMATCH
    trigger: 跨租户访问 / 租户头与 token 不符
  - http: 404
    code: 3001
    name: NOT_FOUND
    trigger: 资源不存在（仅限本租户内确实不存在）
  - http: 409
    code: 4001
    name: VERSION_CONFLICT
    trigger: 版本不可覆盖（plan / scale_item_bank / verdict）
  - http: 409
    code: 4002
    name: IDEMPOTENT_REPLAY
    trigger: 幂等键命中已有记录（返回首次结果）
  - http: 422
    code: 5001
    name: BUSINESS_RULE_VIOLATED
    trigger: 业务规则不满足（如题组量程 ≠ 0–4）
  - http: 429
    code: 6001
    name: RATE_LIMITED
    trigger: 触发节流（如 onShow 5 分钟窗口）
  - http: 500
    code: 9001
    name: INTERNAL_ERROR
    trigger: 服务端异常
  - http: 403
    code: 2004
    name: PLACEHOLDER_OUT_OF_SCOPE
    trigger: 占位符越界（模板含未在白名单的占位符）— 域 I 新增

# =============================================================================
# 域 A · 租户与权限（3 行）
# =============================================================================
paths:
  /auth/login:
    post:
      operationId: authLogin
      tags: [A-租户与权限]
      summary: A1 登录，签发 token
      x-contract-row: A1
      x-callable-roles: [client, therapist, meridian, admin]
      x-client-forbidden: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, credential, client_end]
              properties:
                account:
                  type: string
                  description: 员工号 / 客户 openid 绑定号
                credential:
                  type: string
                  description: 密码 / 短信码
                client_end:
                  type: string
                  enum: [mp, app, web]
                  x-visibility-note: client_end=mp 时可见字段须过 §5.1 R1~R8 词表校验
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResultEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginData' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/TenantMismatch' }

  /auth/me:
    get:
      operationId: authMe
      tags: [A-租户与权限]
      summary: A2 当前身份 + 角色 + 可见性档位解算结果（可见性档位唯一权威下发点）
      description: |
        ⚠️ 本接口只下发「档位布尔值」，不下发任何业务字段 —— 它是声明，不是数据。
        三端 UI 依此声明决定渲染分支，但字段仍由服务端裁剪（X-1：声明 ≠ 授权，二者须一致）。
      x-contract-row: A2
      x-callable-roles: [client, therapist, meridian, admin]
      x-client-forbidden: false
      responses:
        '200':
          description: 身份与档位
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResultEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthMeData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /stores:
    get:
      operationId: listStores
      tags: [A-租户与权限]
      summary: A3 门店列表（按行级 scope 过滤）
      x-contract-row: A3
      x-callable-roles: [therapist, meridian, admin]
      x-client-forbidden: false
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 门店分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResultEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StoreListData' }
        '403': { $ref: '#/components/responses/VisibilityDenied' }

# =============================================================================
# 域 B · 客户与档案（6 行）
# =============================================================================
  /screening-records:
    post:
      operationId: createScreeningRecord
      tags: [B-客户与档案]
      summary: B1 禁忌筛查提交（硬门禁①）
      description: |
        命中禁忌（result=不通过）→ 客户状态置 REJECTED，后续 B2/B3 入口 403 GATE_MISSING
        （missing_items=["screening_result"]）。记录不可删除。
      x-contract-row: B1
      x-callable-roles: [therapist, meridian, admin]
      x-client-forbidden: false
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScreeningCreateRequest' }
      responses:
        '200':
          description: 筛查结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResultEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ScreeningData' }
        '400': { $ref: '#/components/responses/ValidationFailed' }

  /customers:
    post:
      operationId: createCustomer
      tags: [B-客户与档案]
      summary: B2 建档（POST /archive 语义）
      description: 需 screening_result=通过。phone 为租户内唯一（跨店识别键）。
      x-contract-row: B2
      x-callable-roles: [therapist, meridian, admin]
      x-client-forbidden: false
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerCreateRequest' }
      responses:
        '200':
          description: 建档结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResultEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CustomerCreateData' }
        '403': { $ref: '#/components/responses/GateMissing' }

  /customers/{id}/consents:
    post:
      operationId: signConsent
      tags: [B-客户与档案]
      summary: B3 签知情同意书
      description: 需 PROFILED（门禁 G1：未建档不得签知情同意书）。
      x-contract-row: B3
      x-callable-roles: [therapist, meridian, admin]
      x-client-forbidden: false
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: 签署结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultEnvelope' }
        '403': { $ref: '#/components/responses/GateMissing' }

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [B-客户与档案]
      summary: B4 客户详情（可见性裁剪重点接口）
      description: |
        🔴 客户 token 请求含派生字段的 query（如 ?include=verdict）→ 403 VISIBILITY_DENIED，
        data.denied_fields 回显被拒字段名。
      x-contract-row: B4
      x-callable-roles: [client, therapist, meridian, admin]
      x-client-forbidden: false
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - name: include
          in: query
          required: false
          schema: { type: string }
          description: 追加字段（如 verdict）；命中客户不可见字段组时 403 VISIBILITY_DENIED
      responses:
        '200':
          description: 客户详情（已按矩阵裁剪）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResultEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CustomerDetailData' }
        '403': { $ref: '#/components/responses/VisibilityDenied' }
        '404': { $ref: '#/components/responses/NotFound' }

  /customers/{id}/intake-profile:
    get:
      operationId: getIntakeProfile
      tags: [B-客户与档案]
      summary: B5 建档扩展档案
      x-contract-row: B5
      x-callable-roles: [client, therapist, meridian, admin]
      x-client-forbidden: false
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: 建档扩展档案
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultEnvelope' }
    patch:
      operationId: patchIntakeProfile
      tags: [B-客户与档案]
      summary: B6 补充 + 修订（append-only 留痕，不可覆盖）
      x-contract-row: B6
      x-callable-roles: [therapist, meridian, admin]
      x-client-forbidden: false
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: 修订结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultEnvelope' }

# =============================================================================
# 域 C · 评估与题库（4 行）
# =============================================================================
  /scale-item-banks:
    get:
      operationId: listScaleItemBanks
      tags: [C-评估与题库]
