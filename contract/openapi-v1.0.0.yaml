        threshold_version: { type: string, x-visible-to: [meridian, admin] }
        decided_at: { type: string, format: date-time, x-visible-to: [meridian, admin] }

    # 🛑 A-2 新增：F1 的 requestBody（此前为已登记的契约缺口 —— 客户端无法据契约生成请求）。
    #    入参 = 判定所需的【原始事实】。branch / effect_verdict / disposition 一律不在此 ——
    #    它们由服务端按 effect_verdict × adherence_state × risk_flag 组合算出（PRD P0-12）。
    CreateVerdictRequest:
      type: object
      required: [customer_id, sequence_no, same_origin, adherence, risk_flag,
                 core_metric_improved, confidence, module_scores]
      x-request-body-captured: "A-2 (2026-09-26)"
      properties:
        customer_id: { type: string, description: 客户（用于历史查询与越权判定）}
        sequence_no: { type: integer, minimum: 1, description: 第 N 次评估 }
        base_total: { type: integer, description: 基线模块总分；缺失 ⇒ 挂起（D5）}
        current_total: { type: integer, description: 复评模块总分；缺失 ⇒ 挂起（D5）}
        same_origin:
          type: object
          description: 同源断言（三项；任一项缺省 = 不成立 = 不可比 ⇒ 挂起）
          properties:
            same_item_group: { type: boolean }
            range_matches: { type: boolean }
            same_measurer: { type: boolean }
        adherence:
          type: object
          description: 依从四维（键为 A1/A3/A4；🛑 A2 永不参与 AS）
          properties:
            expected_days: { type: integer, minimum: 0 }
            dimensions:
              type: object
              additionalProperties:
                type: object
                properties:
                  applicable: { type: boolean }
                  value: { type: number }
                  structural_missing: { type: boolean }
        risk_flag:
          type: string
          enum: [无, 高危, 新发, 同病]
          description: 🛑 缺失 ⇒ 未定（不得默认「无」—— 那会让 D4 该触发而不触发）
        core_metric_improved: { type: boolean, description: 经络师结构化录入；缺失 ⇒ 挂起 }
        confidence:
          type: object
          description: 置信度四项因子
          properties:
            same_origin_status: { type: string }
            answered_count: { type: integer, minimum: 0 }
            expected_days: { type: integer, minimum: 0 }
            mcid_delta: { type: integer }
        module_scores:
          type: object
          description: 模块分 M1–M5（各 0–16）
          additionalProperties: { type: integer, minimum: 0, maximum: 16 }
        band_trend_note: { type: string, description: 手环趋势说明（U-15 四条备注语义的载体）}
        threshold_version:
          type: string
          description: |
            🛑【断言位，不是取值位】可空（空 = 服务端按当前口径填）；
            非空时必须逐字等于服务端算出的内容寻址指纹，否则拒写 4001。

    # 🛑 C4 的 requestBody。它只承载【评估侧事实】——
    #    branch / effect_verdict / improvement_rate 属判定侧产物，由 F1 产出。
    CreateCycleAssessmentRequest:
      type: object
      required: [cycle_id, sequence_no, adherence, module_scores]
      x-request-body-captured: "本批（与 F1 同批冻结）"
      properties:
        cycle_id:
          type: string
          description: 周期评估主键（必填 —— 使 F1 能在同一行上补判定）
        sequence_no: { type: integer, minimum: 1, description: 第 N 次评估（每 7 次触发）}
        adherence:
          type: object
          description: 依从四维（与 F1 同一形状 —— 两侧对同一事实不得有两套字段名）
          properties:
            expected_days: { type: integer, minimum: 0 }
            dimensions:
              type: object
              additionalProperties:
                type: object
                properties:
                  applicable: { type: boolean }
                  value: { type: number }
                  structural_missing: { type: boolean }
        expected_days: { type: integer, minimum: 0, description: 应填天数（样本护栏）}
        module_scores:
          type: object
          description: 模块分 M1–M5（各 0–16）
          additionalProperties: { type: integer, minimum: 0, maximum: 16 }
        band_trend_note: { type: string }
        threshold_version:
          type: string
          description: 断言位（可空 = 服务端填；非空须逐字等于服务端指纹）

