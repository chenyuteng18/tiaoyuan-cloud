        '200':
          description: 新建结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultEnvelope' }

  /doc-templates/uploads:
    post:
      operationId: uploadDocTemplate
      tags: [I-文书模板与渲染]
      summary: I3 上传（multipart/form-data → source_type=upload）
      description: |
        上传约束：mime_type 仅允许三值（application/pdf /
        application/vnd.openxmlformats-officedocument.wordprocessingml.document / text/markdown）；
        file_size ≤ 10 MiB；落盘前先算 file_hash（SHA-256 hex），
        同 <tenant, doc_type> 下同 hash 重复上传 → 返回已有版本号（幂等返回 4002）。

        🛑 反病毒 / 反脚本：上传文件不得作为可执行内容被服务端解析执行；
           DOCX 不得解压执行宏（只做字节存储 + 哈希，不做宏解析）。
      x-contract-row: I3
      x-callable-roles: [admin]
      x-client-forbidden: false
      x-frontier: 占位待冻结
      x-idempotency-key: "(tenant_id, doc_type, file_hash)"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 上传结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultEnvelope' }
        '403': { $ref: '#/components/responses/TenantMismatch' }
        '409': { $ref: '#/components/responses/IdempotentReplay' }

  /doc-templates/{id}/versions:
    post:
      operationId: createDocTemplateVersion
      tags: [I-文书模板与渲染]
      summary: I4 新版本（editor / upload 均可；不可覆盖）
      x-contract-row: I4
      x-callable-roles: [admin]
      x-client-forbidden: false
      x-frontier: 占位待冻结
