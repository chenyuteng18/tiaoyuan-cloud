        '200':
          description: 新版本结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultEnvelope' }
        '403': { $ref: '#/components/responses/VisibilityDenied' }
    get:
      operationId: listDocTemplateVersions
      tags: [I-文书模板与渲染]
      summary: I5 版本列表（含 source_type / file_hash / change_reason，不含正文）
      x-contract-row: I5
      x-callable-roles: [admin]
      x-client-forbidden: false
      x-frontier: 占位待冻结
      parameters:
        - $ref: '#/components/parameters/DocTemplateId'
      responses:
        '200':
          description: 版本列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultEnvelope' }

  /doc-templates/{id}/versions/{version}/publish:
    post:
      operationId: publishDocTemplateVersion
      tags: [I-文书模板与渲染]
      summary: I6 发布（置 is_active=true，同 doc_type 其他版本置 false）
      x-contract-row: I6
      x-callable-roles: [admin]
      x-client-forbidden: false
      x-frontier: 占位待冻结
      parameters:
        - $ref: '#/components/parameters/DocTemplateId'
        - name: version
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 发布结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultEnvelope' }

  /doc-templates/{id}/download:
    get:
      operationId: downloadDocTemplate
      tags: [I-文书模板与渲染]
      summary: I7 下载原件（上传形态用）—— 仅超管
      x-contract-row: I7
      x-callable-roles: [admin]
      x-client-forbidden: false
      x-frontier: 占位待冻结
      x-super-admin-only: true
      parameters:
        - $ref: '#/components/parameters/DocTemplateId'
        - name: version
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 原件字节流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403': { $ref: '#/components/responses/VisibilityDenied' }

  /agreements/{id}/render:
    post:
      operationId: renderAgreement
      tags: [I-文书模板与渲染]
      summary: I8 签署时渲染（服务端 → 电子签厂商，无客户端可见面）
      description: |
        渲染规则（四条）：
          ① 占位符只从白名单取值，未声明 placeholder_schema 时只允许零占位符（fail-closed）；
          ② 未在白名单的占位符 → 报错 2004，不静默留空；
          ③ customer.phone 强制脱敏（前 3 后 4，原名不得出现在文书内）；
          ④ 渲染结果必须落快照 + hash（否则事后无法证明签的是哪一版）。
        🛑 渲染期只做文本占位符替换，不做 DOCX 内嵌逻辑求值。
        🛑 QC-6 不变量：模板正文一律不得作为客户端包资产下发。
