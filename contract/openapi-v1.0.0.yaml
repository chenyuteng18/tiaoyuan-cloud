# =============================================================================
# 域 H · 文书与电子签（1 行 · 🆕 占位待冻结）
# 🛑 本节只冻结形态（事件枚举 / 幂等键 / 失败处置 / 数据边界），
#    不冻结任何字段名、载荷结构、签名算法。厂商选定之前，三端不得据本节编码。
# =============================================================================
  /esign/callbacks/{provider}:
    post:
      operationId: receiveEsignCallback
      tags: [H-文书与电子签]
      summary: H1 厂商回调接收端点（占位 · 待厂商选定后冻结）
      description: |
        服务端对服务端，无客户端可见面。

        已冻结的形态（三条）：
          ① 事件枚举 event_type ∈ {signed, rejected, expired}；
             signed 推进文书状态 → 放行 06 屏门禁（PLAN_APPROVED → AGREEMENT_SIGNED）；
             rejected / expired 保持未签、不推进门禁，仅登记事实。
          ② 幂等键 = sign_request_id + event_type（重复投递必须幂等，返回首次处理结果）。
          ③ 🛑 数据边界（硬约束）：回调载荷不得承载任何健康数据 / 禁忌结论 ——
             载荷允许承载范围白名单仅「签署事件 + 文书标识 + 租户标识 + 时间戳」。

        ⚠️ 未冻结（不得写成结论）：字段名 / 载荷结构 / 厂商签名算法 / {provider} 取值域 /
           投递语义（是否 at-least-once、重试策略、是否支持主动查询补数）/
           多租户反解所依赖的厂商透传字段名。
      x-contract-row: H1
      x-callable-roles: []
      x-client-forbidden: true
      x-frontier: 占位待冻结
      x-frozen-form-only:
        - event_type 三值枚举
        - 幂等键 sign_request_id + event_type
        - 载荷白名单（不得承载健康数据 / 禁忌结论）
      x-not-frozen:
        - 字段名 / 载荷结构
        - 厂商签名算法
        - "provider 路径参数的取值域"
        - 投递语义（at-least-once / 重试 / 主动查询补数）
        - 多租户反解的厂商透传字段名
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
          description: 取值域（如 e签宝 / 腾讯电子签 / 法大大）与厂商选定同步冻结
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 载荷结构待厂商选定后冻结（本节只登记形态）
      responses:
        '200':
          description: 受理结果（幂等键命中时返回首次处理结果）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultEnvelope' }
        '409': { $ref: '#/components/responses/IdempotentReplay' }

# =============================================================================
# 域 I · 文书模板与渲染（8 行 · 🆕 占位待冻结）
# 🛑 本节只冻结形态（方法与路径 / 上传与渲染关键约定 / 错误码 / 数据边界），
#    不冻结任何字段名、载荷结构、请求体细节。
#    I2~I7 = super_admin（tenant 级，不跨租户）；I1 对门店负责人 / 区域督导只读。
# =============================================================================
  /doc-templates:
    get:
      operationId: listDocTemplates
      tags: [I-文书模板与渲染]
      summary: I1 模板列表（按 doc_type 过滤）
      description: 门店负责人 / 区域督导只读（仅 is_active=true，仅 title + version，不含 content / file_ref）。
      x-contract-row: I1
      x-callable-roles: [admin]
      x-client-forbidden: false
      x-frontier: 占位待冻结
      parameters:
        - name: doc_type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/DocType' }
        - name: is_active
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: 模板列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultEnvelope' }
    post:
      operationId: createDocTemplate
      tags: [I-文书模板与渲染]
      summary: I2 新建（source_type=editor，JSON 正文）
      x-contract-row: I2
      x-callable-roles: [admin]
      x-client-forbidden: false
      x-frontier: 占位待冻结
