openapi: 3.0.3
info:
  title: 上医智养堂 · 三端接口契约（调元云）
  version: api-contract-v1.0.0
  description: "三端（客户小程序 / 调理师·经络师 APP / 管理员 Web）一次冻结的接口契约。\n\n版本号规则（语义化，与 info.version 同值）：\n  - MAJOR（破坏级）：字段删除 / 改名 / 类型变更；可见性档位变更；枚举值语义变更；错误码语义变更；\n    涉可见性档位的 MAJOR 变更须触发「变更业务裁定」（不得按\"体验优化\"处理）。\n  - MINOR（兼容级）：新增可选请求字段 / 新增接口 / 新增响应字段。\n  - PATCH（文档级）：注释 / 示例 / 措辞修正，不动字段与语义。\n\n\U0001F6D1 措辞纪律：client_end=mp 可见字段不得含\"退款\"\"诊断\"；同步时间精确到日。\n"
  contact:
    name: 后端主程（技术单签）· 产品共签（可见性 / 措辞档位）
  license:
    name: Proprietary
servers:
- url: /api/v1
  description: Base Path（契约 §2.0 全局约定）
tags:
- name: A-租户与权限
  description: 登录 / 身份与可见性档位下发 / 门店列表
- name: B-客户与档案
  description: 禁忌筛查 / 建档 / 同意书 / 档案详情 / 建档扩展档案
- name: C-评估与题库
  description: 题库拉取 / 基线评估 / 周期评估
- name: D-服务与履约
  description: 服务核销 / 每日填报 / 方案与审核 / 设备参数下发
- name: E-设备与手环数据
  description: 同步批次四态 / 遥测上行 / 原始数据 / 派生结果 / 日期探测 / 同步状态卡
- name: F-判定与稽核
  description: 判定结论落库 / 判定历史 / 稽核信号 / 可判定覆盖率
- name: G-退款与挽留
  description: 代录诉求 / 工单详情 / 挽留 / 审批 / 回执（客户端与调理师端一律 403）
- name: H-文书与电子签
  description: 厂商回调接收端点（占位 · 待厂商选定后冻结）
- name: I-文书模板与渲染
  description: 模板列表 / 新建 / 上传 / 版本 / 发布 / 下载 / 签署时渲染（占位 · 字段未冻结）
x-global-conventions:
  base-path: /api/v1
  auth: 'Authorization: Bearer <token>（token 内嵌 tenant_id / role / staff_id）'
  tenant-context: '服务端从 token 取 tenant_id；请求头 X-Tenant-Id 若存在必须与 token 一致，

    否则 403 TENANT_MISMATCH。跨租户资源一律 403（存储层直接拒绝，

    不返回 404 以避免存在性探测）。

    '
  envelope: '{ "code": 0, "message": "ok", "data": {...}, "trace_id": "..." }'
  envelope-rule: code != 0 时 data 为空
  pagination: 请求 ?page=<int>&page_size=<int≤100>；响应 data.{items[], total, page, page_size}
  visibility: 每个接口的响应字段按 x-visibility 矩阵在服务端裁剪；无权限字段不下发（不是 null、不是空串）
  forbidden-403: 「前置门禁缺失」与「可见性档位不足」统一返回 403，message 必须给出缺失项名称 / 档位名称（不得模糊报错）
  idempotency: 写接口接受 Idempotency-Key 请求头（UUID）；服务端在 24h 窗口内去重
x-api-protocol:
  auth-header: Authorization
  auth-scheme: Bearer
  tenant-header: X-Tenant-Id
  tenant-mismatch-invariant: X-Tenant-Id 若存在必须与 token 内 tenant_id 一致（仅校验、不采纳），否则 403 TENANT_MISMATCH；跨租户资源一律 403
  trace-header: X-Trace-Id
  idempotency-header: Idempotency-Key
  idempotency-window-hours: 24
  envelope-fields:
  - code
  - message
  - data
  - trace_id
  envelope-ok-code: 0
  envelope-rule: code != 0 时 data 为空
x-field-groups:
  raw_data:
    name: ① 手环原始数据
    fields: 睡眠 / 步数 / 心率 / 静息心率 / 血氧 / 运动类型
  capture_status:
    name: ② 采集状态
    fields: 已采集天数 / 同步时间（synced_at，精确到日）/ 接入状态
  gap_reason:
    name: ③ 缺口原因分类
    fields: gap_reason
  derived_result:
    name: ④ 派生结果
    fields: 依从性维度分（含 A3）/ AS 值 / effect_verdict / 退款资格
x-visibility-matrix:
  raw_data:
    client: true
    therapist: true
    meridian: true
    admin: true
    store_customer_service: false
  capture_status:
    client: true
    therapist: true
    meridian: true
    admin: true
    store_customer_service: false
  gap_reason:
    client: false
    therapist: true
    meridian: true
    admin: true
    store_customer_service: false
  derived_result:
    client: false
    therapist: true
    meridian: true
    admin: true
    store_customer_service: false
  notes:
  - 门店客服无端（不使用系统）—— 该界面不成立，任何字段组均不成立
  - admin 档位另按行级 scope 收窄（本店 / 辖区 / 全量）
  - 客户侧 ③④ 为硬约束、不得通过配置放开 —— 放开属「变更业务裁定」
x-roles:
  client:
    token-role: client
    end: mp
    display: 客户（小程序）
  therapist:
    token-role: therapist
    end: app
    display: 调理师（APP）
  meridian:
    token-role: meridian
    end: app
    display: 经络师（APP）
  admin:
    token-role:
    - manager
    - area
    - hq
    end: web
    display: 管理员（门店负责人 / 区域督导 / 总部运营）
  store_customer_service:
    token-role: null
    end: null
    display: 门店客服（无端，无任何接口）
x-wording-discipline:
  client-forbidden-terms:
  - 退款
  - 诊断
  - 未佩戴
  - 缺失
  - 达标
  - 不达标
  - 无效退款
  - 概不退款
  client-visible-naming-rules:
    R1: 客户可见字段名 / 枚举值不得含"退款"
    R2: 客户可见字段名 / 枚举值不得含"诊断"
    R3: 客户可见不出现派生结论（字段整体不下发）
    R4: 客户可见同步时间精确到日，不得到分秒
    R5: 客户可见正向计数 + 中性描述
    R6: 未接入态不得用 0 / 空图表 / 示例数据顶替
    R7: 客户可见不得出现"达标/未达标"评价
    R8: 派生结论侧禁用"不利"色 / 措辞
  namespace-isolation: 客户可见枚举以 client_* 前缀；内部枚举以 internal_* / 原名 —— 两套不得共用类型定义
x-error-codes:
- http: 400
  code: 1001
  name: VALIDATION_FAILED
  trigger: 参数类型 / 必填 / 约束不满足
- http: 401
  code: 1002
  name: UNAUTHENTICATED
  trigger: 无 token / token 过期 / token 非法
- http: 403
  code: 2001
  name: VISIBILITY_DENIED
  trigger: 该角色对请求字段组无可见性档位（服务端裁剪，非前端不渲染）
- http: 403
  code: 2002
  name: GATE_MISSING
  trigger: 前置门禁缺失（data.missing_items 给出缺失项名）
- http: 403
  code: 2003
  name: TENANT_MISMATCH
  trigger: 跨租户访问 / 租户头与 token 不符
- http: 404
  code: 3001
  name: NOT_FOUND
  trigger: 资源不存在（仅限本租户内确实不存在）
- http: 409
  code: 4001
  name: VERSION_CONFLICT
  trigger: 版本不可覆盖（plan / scale_item_bank / verdict）
- http: 409
  code: 4002
  name: IDEMPOTENT_REPLAY
  trigger: 幂等键命中已有记录（返回首次结果）
- http: 422
  code: 5001
  name: BUSINESS_RULE_VIOLATED
  trigger: 业务规则不满足（如题组量程 ≠ 0–4）
- http: 429
  code: 6001
  name: RATE_LIMITED
  trigger: 触发节流（如 onShow 5 分钟窗口）
- http: 500
  code: 9001
  name: INTERNAL_ERROR
  trigger: 服务端异常
- http: 403
  code: 2004
  name: PLACEHOLDER_OUT_OF_SCOPE
  trigger: 占位符越界（模板含未在白名单的占位符）— 域 I 新增
paths:
  /auth/login:
    post:
      operationId: authLogin
      tags:
      - A-租户与权限
      summary: A1 登录，签发 token
      x-contract-row: A1
      x-callable-roles:
      - client
      - therapist
      - meridian
      - admin
      x-client-forbidden: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - account
              - credential
              - client_end
              properties:
                account:
                  type: string
                  description: 员工号 / 客户 openid 绑定号
                credential:
                  type: string
                  description: 密码 / 短信码
                client_end:
                  type: string
                  enum:
                  - mp
                  - app
                  - web
                  x-visibility-note: client_end=mp 时可见字段须过 §5.1 R1~R8 词表校验
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ResultEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/LoginData'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantMismatch'
  /auth/me:
    get:
      operationId: authMe
      tags:
      - A-租户与权限
      summary: A2 当前身份 + 角色 + 可见性档位解算结果（可见性档位唯一权威下发点）
      description: '⚠️ 本接口只下发「档位布尔值」，不下发任何业务字段 —— 它是声明，不是数据。

        三端 UI 依此声明决定渲染分支，但字段仍由服务端裁剪（X-1：声明 ≠ 授权，二者须一致）。

        '
      x-contract-row: A2
      x-callable-roles:
      - client
      - therapist
      - meridian
      - admin
      x-client-forbidden: false
      responses:
        '200':
          description: 身份与档位
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ResultEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AuthMeData'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /customers/{id}:
    get:
      operationId: getCustomer
      tags:
      - B-客户与档案
      summary: B4 客户详情（可见性裁剪重点接口）
      description: '🔴 客户 token 请求含派生字段的 query（如 ?include=verdict）→ 403 VISIBILITY_DENIED，

        data.denied_fields 回显被拒字段名。

        '
      x-contract-row: B4
      x-callable-roles:
      - client
      - therapist
      - meridian
      - admin
      x-client-forbidden: false
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      - name: include
        in: query
        required: false
        schema:
          type: string
        description: 追加字段（如 verdict）；命中客户不可见字段组时 403 VISIBILITY_DENIED
      responses:
        '200':
          description: 客户详情（已按矩阵裁剪）
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ResultEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CustomerDetailData'
        '403':
          $ref: '#/components/responses/VisibilityDenied'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{id}/intake-profile:
    get:
      operationId: getIntakeProfile
      tags:
      - B-客户与档案
      summary: B5 建档扩展档案
      x-contract-row: B5
      x-callable-roles:
      - client
      - therapist
      - meridian
      - admin
      x-client-forbidden: false
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: 建档扩展档案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEnvelope'
  /scale-item-banks:
    get:
      operationId: listScaleItemBanks
      tags:
      - C-评估与题库
      summary: C1 题库拉取（按分龄组 + 维度）
      x-contract-row: C1
      x-callable-roles:
      - client
      - therapist
      - meridian
      - admin
      x-client-forbidden: false
      parameters:
      - name: age_group
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/AgeGroup'
      - name: dimension
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Dimension'
      - name: version
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 题组
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEnvelope'
  /customers/{id}/assessments/{assessment_id}:
    get:
      operationId: getAssessment
      tags:
      - C-评估与题库
      summary: C3 评估详情
      x-contract-row: C3
      x-callable-roles:
      - client
      - therapist
      - meridian
      - admin
      x-client-forbidden: false
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      - name: assessment_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 评估详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{id}/visits:
    get:
      operationId: listVisits
      tags:
      - D-服务与履约
      summary: D2 服务记录（客户维度全局账本）
      x-contract-row: D2
      x-callable-roles:
      - client
      - therapist
      - meridian
      - admin
      x-client-forbidden: false
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 服务记录分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEnvelope'
  /customers/{id}/daily-reports:
    post:
      operationId: submitDailyReport
      tags:
      - D-服务与履约
      summary: D3 每日填报提交
      x-contract-row: D3
      x-callable-roles:
      - client
      - therapist
      - meridian
      - admin
      x-client-forbidden: false
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyReportRequest'
      responses:
        '200':
          description: 填报结果
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ResultEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/DailyReportData'
        '400':
          $ref: '#/components/responses/ValidationFailed'
    get:
      operationId: listDailyReports
      tags:
      - D-服务与履约
      summary: D4 填报记录
      x-contract-row: D4
      x-callable-roles:
      - client
      - therapist
      - meridian
      - admin
      x-client-forbidden: false
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: 填报记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEnvelope'
  /plans/{id}:
    get:
      operationId: getPlan
      tags:
      - D-服务与履约
      summary: D5-b 方案查阅
      x-contract-row: D5
      x-callable-roles:
      - client
      - therapist
      - meridian
      - admin
      x-client-forbidden: false
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 方案详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /band/sync-batches:
    post:
      operationId: reportBandSyncBatch
      tags:
      - E-设备与手环数据
      summary: E1 客户端上报同步批次（四态）
      x-contract-row: E1
      x-callable-roles:
      - client
      x-client-forbidden: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BandSyncBatchRequest'
      responses:
        '200':
          description: 批次受理结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/IdempotentReplay'
        '429':
          $ref: '#/components/responses/RateLimited'
  /band/telemetry:
    post:
      operationId: upsertBandTelemetry
      tags:
      - E-设备与手环数据
      summary: E2 客户端上行逐日采集数据（幂等 upsert · 双分支）
      description: "幂等键【双分支】（契约 §4.3）：\n  · 按日型 × 12 → (device_id, metric, date, hour, minute)，日聚合接口退化为 (device_id, metric, date)\n  · 游标型 × 1  → (device_id, 'sport', current_sport_id)\n\U0001F534 运动数据不得复用按日型幂等键。\n"
      x-contract-row: E2
      x-callable-roles:
      - client
      x-client-forbidden: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BandTelemetryRequest'
      responses:
        '200':
          description: upsert 结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEnvelope'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolated'
  /customers/{id}/band/telemetry:
    get:
      operationId: getBandTelemetry
      tags:
      - E-设备与手环数据
      summary: E3 手环原始数据 + 采集状态（四端按档裁剪）
      x-contract-row: E3
      x-callable-roles:
      - client
      - therapist
      - meridian
      - admin
      x-client-forbidden: false
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: 手环数据（已按矩阵裁剪）
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ResultEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/BandTelemetryData'
        '403':
          $ref: '#/components/responses/VisibilityDenied'
  /band/available-dates:
    post:
      operationId: reportBandAvailableDates
      tags:
      - E-设备与手环数据
      summary: E5 设备可用日期探测结果上报（N 运行时探测 · 禁硬编码）
      description: "\U0001F6D1 N 取运行时探测值，禁止硬编码：\n  · 服务端不得内置 N = 7 / N = 14 等任何常量；\n  · retention_window_days 一律取自本接口 valid_history_dates 的计算结果；\n  · 未探测到 → 返回 TBD，UI 与文案不得给出具体天数，不得按\"数据齐全\"预设布局。\n服务端计算：pull_start_date = max(last_synced_date + 1, today − retention_window_days)，\n上界 = today（含当日）。\n"
      x-contract-row: E5
      x-callable-roles:
      - client
      x-client-forbidden: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BandAvailableDatesRequest'
      responses:
        '200':
          description: 探测结果
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ResultEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/BandAvailableDatesData'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '422':
          $ref: '#/components/responses/BusinessRuleViolated'
  /customers/{id}/band/sync-status:
    get:
      operationId: getBandSyncStatus
      tags:
      - E-设备与手环数据
      summary: E6 客户端同步状态卡（四态）
      x-contract-row: E6
      x-callable-roles:
      - client
      x-client-forbidden: false
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: 同步状态卡
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ResultEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/BandSyncStatusData'
components:
  parameters:
    CustomerId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 客户 ID（服务端从 token 校验租户归属）
    DocTemplateId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        maximum: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: 服务端在 24h 窗口内去重
  responses:
    ValidationFailed:
      description: 400 VALIDATION_FAILED（参数类型/必填/约束不满足）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultEnvelope'
    Unauthenticated:
      description: 401 UNAUTHENTICATED（无 token / token 过期）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultEnvelope'
    VisibilityDenied:
      description: 403 VISIBILITY_DENIED（该角色对请求字段组无可见性档位；data.denied_fields 回显被拒字段名）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultEnvelope'
    GateMissing:
      description: 403 GATE_MISSING（前置门禁缺失；data.missing_items[] 给出缺失项名称，不得模糊报错）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultEnvelope'
    TenantMismatch:
      description: 403 TENANT_MISMATCH（跨租户访问 / 租户头与 token 不符）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultEnvelope'
    PlaceholderOutOfScope:
      description: 403/2004 PLACEHOLDER_OUT_OF_SCOPE（模板含未在白名单的占位符）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultEnvelope'
    NotFound:
      description: 404 NOT_FOUND（仅限本租户内确实不存在）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultEnvelope'
    VersionConflict:
      description: 409 VERSION_CONFLICT（版本不可覆盖）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultEnvelope'
    IdempotentReplay:
      description: 409 IDEMPOTENT_REPLAY（幂等键命中已有记录，返回首次结果）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultEnvelope'
    BusinessRuleViolated:
      description: 422 BUSINESS_RULE_VIOLATED（业务规则不满足，如题组量程 ≠ 0–4）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultEnvelope'
    RateLimited:
      description: 429 RATE_LIMITED（触发节流，如 onShow 5 分钟窗口）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultEnvelope'
    InternalError:
      description: 500 INTERNAL_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultEnvelope'
  schemas:
    ResultEnvelope:
      type: object
      required:
      - code
      - message
      - trace_id
      properties:
        code:
          type: integer
          description: 0 = 成功；非 0 见 x-error-codes
        message:
          type: string
          description: 面向开发者，不得直接渲染给客户（客户端有自己的 code → copy 映射）
        data:
          type: object
          nullable: true
          description: code != 0 时为空
        trace_id:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
      x-visibility-note: 信封字段对全部角色可见
    LoginData:
      type: object
      properties:
        token:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        expires_in:
          type: integer
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        role:
          type: string
          enum:
          - client
          - therapist
          - meridian
          - manager
          - area
          - hq
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
          description: 客户=client / 调理师=therapist / 经络师=meridian / 门店负责人=manager / 区域督导=area / 总部运营=hq
        client_end:
          type: string
          enum:
          - mp
          - app
          - web
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        tenant_id:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        staff_id:
          type: string
          x-visible-to:
          - therapist
          - meridian
          - admin
          description: 客户无 staff_id（差异项）
    AuthMeData:
      type: object
      properties:
        role:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        band_visibility:
          type: object
          description: 字段组档位布尔值（声明，不是数据）
          properties:
            field_group_1_raw:
              type: boolean
              x-visible-to:
              - client
              - therapist
              - meridian
              - admin
            field_group_2_status:
              type: boolean
              x-visible-to:
              - client
              - therapist
              - meridian
              - admin
            field_group_3_gap_reason:
              type: boolean
              x-visible-to:
              - client
              - therapist
              - meridian
              - admin
            field_group_4_derived:
              type: boolean
              x-visible-to:
              - client
              - therapist
              - meridian
              - admin
        refund_visibility:
          type: boolean
          x-visible-to:
          - meridian
          - admin
          description: 调理师 false（config
        store_scope:
          type: object
          x-visible-to:
          - therapist
          - meridian
          - admin
          properties:
            row_level:
              type: string
              enum:
              - own_store
              - region
              - all
            store_ids:
              type: array
              items:
                type: string
    CustomerDetailData:
      type: object
      properties:
        customer_id:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        name:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        gender:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        age:
          type: integer
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        intake_profile:
          type: object
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        screening_result:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        band_willingness:
          type: string
          enum:
          - 自愿佩戴
          - 暂不佩戴
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        owner_store_id:
          type: string
          x-visible-to:
          - therapist
          - meridian
          - admin
        serving_store_id:
          type: string
          x-visible-to:
          - therapist
          - meridian
          - admin
        effect_verdict:
          type: string
          x-field-group: derived_result
          x-visible-to:
          - therapist
          - meridian
          - admin
          description: 派生字段；客户 token 请求 include=verdict → 403 VISIBILITY_DENIED
        as_value:
          type: number
          x-field-group: derived_result
          x-visible-to:
          - therapist
          - meridian
          - admin
          description: 派生字段；客户恒不下发
    AgeGroup:
      type: string
      enum:
      - 男16-32
      - 男33-40
      - 男41-48
      - 男49以上
      - 女14-28
      - 女29-35
      - 女36-42
      - 女43-49以上
    Dimension:
      type: string
      enum:
      - 体能精力
      - 面部气色肤质
      - 肩颈腰背筋骨
      - 睡眠质量
      - 记忆专注
      - 代谢体态消化
      - 情绪抗压与抵抗力
    DailyReportRequest:
      type: object
      required:
      - date
      - answers_json
      - source
      properties:
        date:
          type: string
          format: date
          description: 补填窗口 ≤2 天（可配置）
        answers_json:
          type: object
          description: 全点选，无开放输入
        source:
          type: string
          enum:
          - 客户
          - 代核
          description: 代录须标 代核
    DailyReportData:
      type: object
      properties:
        report_id:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        date:
          type: string
          format: date
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        weekly_count:
          type: integer
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
          description: 本周 X/7 天（正向计数）
        last_week_compare:
          type: object
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        suggestion:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        source:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
    BandSyncBatchRequest:
      type: object
      required:
      - device_id
      - customer_id
      - batch_no
      - trigger
      - state
      - synced_at
      properties:
        device_id:
          type: string
          description: 客户级穿戴设备 ID（非门店调理设备）
        customer_id:
          type: string
          description: 服务端从 token 校验归属
        batch_no:
          type: string
          format: uuid
          description: 幂等键（Idempotency-Key 同值）
        trigger:
          type: string
          enum:
          - on_show_cold
          - on_show_hot
          - checkin
          - daily_report
          - manual
        state:
          type: string
          enum:
          - syncing
          - synced
          - sync_failed
          - no_data_today
          description: 四态；客户端可见的 client_sync_state（不含"未佩戴"取值）
        synced_at:
          type: string
          format: date-time
          description: 精确记录；客户端展示精确到日
        last_success_date:
          type: string
          format: date
          description: state=synced 时必填
        fail_reason_class:
          type: string
          enum:
          - bt_off
          - unauthorized
          - connect_timeout
          - device_low_battery
          - occupied_by_vendor_app
          - platform_suspended
          - probe_out_of_window
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
          description: state=sync_failed 时必填；技术类，取值域内不得出现"未佩戴"语义
        next_action:
          type: string
          enum:
          - open_bluetooth
          - grant_permission
          - retry
          - none
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
          description: state=sync_failed 时必填（可执行下一步）；不得只给一句"同步失败"
    BandTelemetryRequest:
      type: object
      required:
      - device_id
      - metric
      properties:
        device_id:
          type: string
        metric:
          type: string
          enum:
          - sleep
          - steps
          - hr
          - resting_hr
          - spo2
          - workout
          - bp
          - temp
          - pressure
          - met
          - mai
          - respiration
          - exercise
        date:
          type: string
          format: date
          description: 业务日（设备本地时区）
        hour:
          type: integer
          nullable: true
          description: 日聚合型退化为 NULL
        minute:
          type: integer
          nullable: true
        value:
          description: 按 metric 的 Schema
        interval:
          type: integer
          description: 采样间隔
        is_wear:
          type: integer
          nullable: true
          description: getHealthDetail.isWear；1=佩戴 / 0=脱腕 / (-1,255)=技术性缺失（服务端强制覆写、不判行为性）
        raw_source:
          type: string
        current_sport_id:
          type: string
          description: 游标型 sport 分支
        sport_payload:
          type: object
        sport_length:
          type: integer
          description: 循环判据（sportLength > 1）
    BandTelemetryData:
      type: object
      properties:
        data_source:
          type: string
          enum:
          - 手环
          - 未接入
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
          description: 未接入时数值字段不下发，不得显示 0 / 空图表 / 示例数据
        collected_days:
          type: integer
          x-field-group: capture_status
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
          description: 已采集天数（正向计数）
        synced_date:
          type: string
          format: date
          x-field-group: capture_status
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
          description: 客户可见同步时间精确到日（不得到分秒）
        metrics:
          type: array
          items:
            type: object
          x-field-group: raw_data
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        gap_reason:
          type: string
          enum:
          - no_open
          - sync_failed
          - not_worn
          - compliant_removal
          - involuntary_technical
          - beyond_retention_window
          - unknown
          x-field-group: gap_reason
          x-visible-to:
          - therapist
          - meridian
          - admin
          description: 🔴 客户恒 403 / 不下发（硬约束，配置不得放开）
    BandAvailableDatesRequest:
      type: object
      required:
      - device_id
      - history_type
      - valid_history_dates
      - probed_at
      properties:
        device_id:
          type: string
        history_type:
          type: string
          description: 与厂商枚举对齐（13 条逐日接口对应的 HistoryType；12 按日 + 1 游标）
        valid_history_dates:
          type: array
          items:
            type: string
            format: date
          description: getValidHistoryDates 原样返回（设备端实际存在的日期）
        probed_at:
          type: string
          format: date-time
    BandAvailableDatesData:
      type: object
      properties:
        probe_id:
          type: string
          x-visible-to:
          - client
        retention_window_days:
          oneOf:
          - type: integer
          - type: string
            enum:
            - TBD
          x-visible-to:
          - client
          x-tbd-allowed: true
          description: 🛑 运行时探测值（= 探测到的可用日期跨度）；未探测到 → 返回 TBD，不得回落为硬编码值
        pull_start_date:
          type: string
          format: date
          x-visible-to:
          - client
          description: 服务端计算 start = max(last_synced_date + 1, today − retention_window_days)；上界 = today（含当日）
        earliest_available:
          type: string
          format: date
          x-visible-to:
          - client
        latest_available:
          type: string
          format: date
          x-visible-to:
          - client
    BandSyncStatusData:
      type: object
      properties:
        state:
          type: string
          enum:
          - syncing
          - synced
          - sync_failed
          - no_data_today
          x-visible-to:
          - client
        synced_date:
          type: string
          format: date
          x-visible-to:
          - client
          description: 精确到日
        next_action:
          type: string
          x-visible-to:
          - client
        fail_reason_class:
          type: string
          x-visible-to:
          - client
          description: 仅技术类，无未佩戴
