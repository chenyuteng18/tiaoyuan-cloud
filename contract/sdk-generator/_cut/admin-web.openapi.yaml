components:
  parameters:
    CustomerId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 客户 ID（服务端从 token 校验租户归属）
    DocTemplateId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
      description: 页码（从 1 起）。越界（< 1）一律 400 VALIDATION_FAILED，不静默纠正
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: 每页条数（1..100，缺省 20）。越界（< 1 或 > 100）一律 400 VALIDATION_FAILED，不夹逼
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: 服务端在 24h 窗口内去重
  responses:
    ValidationFailed:
      description: 400 VALIDATION_FAILED（参数类型/必填/约束不满足）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultEnvelope'
    Unauthenticated:
      description: 401 UNAUTHENTICATED（无 token / token 过期）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultEnvelope'
    VisibilityDenied:
      description: 403 VISIBILITY_DENIED（该角色对请求字段组无可见性档位；data.denied_fields 回显被拒字段名）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultEnvelope'
    GateMissing:
      description: 403 GATE_MISSING（前置门禁缺失；data.missing_items[] 给出缺失项名称，不得模糊报错）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultEnvelope'
    TenantMismatch:
      description: 403 TENANT_MISMATCH（跨租户访问 / 租户头与 token 不符）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultEnvelope'
    PlaceholderOutOfScope:
      description: 403/2004 PLACEHOLDER_OUT_OF_SCOPE（模板含未在白名单的占位符）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultEnvelope'
    NotFound:
      description: 404 NOT_FOUND（仅限本租户内确实不存在）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultEnvelope'
    VersionConflict:
      description: 409 VERSION_CONFLICT（版本不可覆盖）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultEnvelope'
    IdempotentReplay:
      description: 409 IDEMPOTENT_REPLAY（幂等键命中已有记录，返回首次结果）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultEnvelope'
    BusinessRuleViolated:
      description: 422 BUSINESS_RULE_VIOLATED（业务规则不满足，如题组量程 ≠ 0–4）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultEnvelope'
    RateLimited:
      description: 429 RATE_LIMITED（触发节流，如 onShow 5 分钟窗口）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultEnvelope'
    InternalError:
      description: 500 INTERNAL_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultEnvelope'
  schemas:
    ResultEnvelope:
      type: object
      required:
      - code
      - message
      - trace_id
      properties:
        code:
          type: integer
          description: 0 = 成功；非 0 见 x-error-codes
        message:
          type: string
          description: 面向开发者，不得直接渲染给客户（客户端有自己的 code → copy 映射）
        data:
          type: object
          nullable: true
          description: code != 0 时为空
        trace_id:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
      x-visibility-note: 信封字段对全部角色可见
    LoginData:
      type: object
      properties:
        token:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        expires_in:
          type: integer
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        role:
          type: string
          enum:
          - client
          - therapist
          - meridian
          - manager
          - area
          - hq
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
          description: 客户=client / 调理师=therapist / 经络师=meridian / 门店负责人=manager / 区域督导=area / 总部运营=hq
        client_end:
          type: string
          enum:
          - mp
          - app
          - web
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        tenant_id:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        staff_id:
          type: string
          x-visible-to:
          - therapist
          - meridian
          - admin
          description: 客户无 staff_id（差异项）
    AuthMeData:
      type: object
      properties:
        role:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        band_visibility:
          type: object
          description: 字段组档位布尔值（声明，不是数据）
          properties:
            field_group_1_raw:
              type: boolean
              x-visible-to:
              - client
              - therapist
              - meridian
              - admin
            field_group_2_status:
              type: boolean
              x-visible-to:
              - client
              - therapist
              - meridian
              - admin
            field_group_3_gap_reason:
              type: boolean
              x-visible-to:
              - client
              - therapist
              - meridian
              - admin
            field_group_4_derived:
              type: boolean
              x-visible-to:
              - client
              - therapist
              - meridian
              - admin
        refund_visibility:
          type: boolean
          x-visible-to:
          - meridian
          - admin
          description: 调理师 false（config
        store_scope:
          type: object
          x-visible-to:
          - therapist
          - meridian
          - admin
          properties:
            row_level:
              type: string
              enum:
              - own_store
              - region
              - all
            store_ids:
              type: array
              items:
                type: string
    StoreListData:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Store'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    Store:
      type: object
      properties:
        store_id:
          type: string
        name:
          type: string
        franchise_type:
          type: string
          enum:
          - 直营
          - 加盟
    ScreeningCreateRequest:
      type: object
      required:
      - customer_id
      - items_json
      - operator_id
      properties:
        customer_id:
          type: string
        items_json:
          type: object
          description: 含 pregnancy / acute / risk_history / nonmedical_disclosed
        operator_id:
          type: string
          description: 服务端从 token 覆写
        customer_sign:
          type: string
        operator_sign:
          type: string
    ScreeningData:
      type: object
      properties:
        screening_id:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        result:
          type: string
          enum:
          - 通过
          - 不通过
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        submitted_at:
          type: string
          format: date-time
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
    CustomerCreateRequest:
      type: object
      required:
      - name
      - gender
      - age
      - phone
      - screening_id
      properties:
        name:
          type: string
        gender:
          type: string
          enum:
          - 男
          - 女
        age:
          type: integer
          minimum: 1
          maximum: 119
        phone:
          type: string
          description: 租户内唯一（跨店识别键）
        screening_id:
          type: string
          description: 服务端校验其 result=通过
    CustomerCreateData:
      type: object
      properties:
        customer_id:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        status:
          type: string
          enum:
          - CREATED
          - PROFILED
          - CONSENTED
          - REJECTED
          - ARCHIVED
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
          description: 5 值粗粒度派生聚合态，不是服务主状态机（14 态见 customer_state_transition）
        owner_store_id:
          type: string
          x-visible-to:
          - therapist
          - meridian
          - admin
          description: 客户不下发
        serving_store_id:
          type: string
          x-visible-to:
          - therapist
          - meridian
          - admin
          description: 客户不下发
    CustomerDetailData:
      type: object
      properties:
        customer_id:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        name:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        gender:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        age:
          type: integer
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        intake_profile:
          type: object
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        screening_result:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        band_willingness:
          type: string
          enum:
          - 自愿佩戴
          - 暂不佩戴
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        owner_store_id:
          type: string
          x-visible-to:
          - therapist
          - meridian
          - admin
        serving_store_id:
          type: string
          x-visible-to:
          - therapist
          - meridian
          - admin
        effect_verdict:
          type: string
          x-field-group: derived_result
          x-visible-to:
          - therapist
          - meridian
          - admin
          description: 派生字段；客户 token 请求 include=verdict → 403 VISIBILITY_DENIED
        as_value:
          type: number
          x-field-group: derived_result
          x-visible-to:
          - therapist
          - meridian
          - admin
          description: 派生字段；客户恒不下发
    AgeGroup:
      type: string
      enum:
      - 男16-32
      - 男33-40
      - 男41-48
      - 男49以上
      - 女14-28
      - 女29-35
      - 女36-42
      - 女43-49以上
    Dimension:
      type: string
      enum:
      - 体能精力
      - 面部气色肤质
      - 肩颈腰背筋骨
      - 睡眠质量
      - 记忆专注
      - 代谢体态消化
      - 情绪抗压与抵抗力
    BaselineAssessmentRequest:
      type: object
      required:
      - scale_id
      - item_group_id
      - age_group_locked
      - dimension_scores
      - total_score
      - measure_operator
      properties:
        scale_id:
          type: string
        item_group_id:
          type: string
          description: 同源题组锁定
        age_group_locked:
          $ref: '#/components/schemas/AgeGroup'
        dimension_scores:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: integer
            minimum: 0
            maximum: 16
        total_score:
          type: integer
          minimum: 0
          maximum: 112
        measure_operator:
          type: string
    BaselineAssessmentData:
      type: object
      properties:
        assessment_id:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        assessed_at:
          type: string
          format: date-time
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        baseline_conclusion:
          type: object
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
          properties:
            haozhuan:
              type: string
              enum:
              - 好转
              - 稳定
              - 下降
        migratable:
          type: boolean
          x-visible-to:
          - therapist
          - meridian
          - admin
          description: 客户不下发
        dimension_scores:
          type: array
          items:
            type: integer
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
          description: 客户仅见本人填答维度
    DailyReportRequest:
      type: object
      required:
      - date
      - answers_json
      - source
      properties:
        date:
          type: string
          format: date
          description: 补填窗口 ≤2 天（可配置）
        answers_json:
          type: object
          description: 全点选，无开放输入
        source:
          type: string
          enum:
          - 客户
          - 代核
          description: 代录须标 代核
    DailyReportData:
      type: object
      properties:
        report_id:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        date:
          type: string
          format: date
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        weekly_count:
          type: integer
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
          description: 本周 X/7 天（正向计数）
        last_week_compare:
          type: object
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        suggestion:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        source:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
    VisitData:
      type: object
      properties:
        visit_id:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        visit_no:
          type: integer
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        executed_at:
          type: string
          format: date-time
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        serving_store_id:
          type: string
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
          description: 客户端可见（标记服务门店）
        gate_check_json:
          type: object
          x-visible-to:
          - therapist
          - meridian
          - admin
          description: 客户不下发
        customer_confirmed:
          type: boolean
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        abnormal_note:
          type: string
          x-visible-to:
          - therapist
          - meridian
          - admin
          description: 客户不下发
    BandTelemetryData:
      type: object
      properties:
        data_source:
          type: string
          enum:
          - 手环
          - 未接入
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
          description: 未接入时数值字段不下发，不得显示 0 / 空图表 / 示例数据
        collected_days:
          type: integer
          x-field-group: capture_status
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
          description: 已采集天数（正向计数）
        synced_date:
          type: string
          format: date
          x-field-group: capture_status
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
          description: 客户可见同步时间精确到日（不得到分秒）
        metrics:
          type: array
          items:
            type: object
          x-field-group: raw_data
          x-visible-to:
          - client
          - therapist
          - meridian
          - admin
        gap_reason:
          type: string
          enum:
          - no_open
          - sync_failed
          - not_worn
          - compliant_removal
          - involuntary_technical
          - beyond_retention_window
          - unknown
          x-field-group: gap_reason
          x-visible-to:
          - therapist
          - meridian
          - admin
          description: 🔴 客户恒 403 / 不下发（硬约束，配置不得放开）
    BandDerivedData:
      type: object
      properties:
        a3_applicable:
          type: boolean
          x-field-group: derived_result
          x-visible-to:
          - therapist
          - meridian
          - admin
          description: 为 false 时不返回 a3_value（避免 0 值被误读为"戴了 0 天"）
        a3_value:
          type: number
          x-field-group: derived_result
          x-visible-to:
          - therapist
          - meridian
          - admin
        as_value:
          type: number
          x-field-group: derived_result
          x-visible-to:
          - therapist
          - meridian
          - admin
        effect_verdict:
          type: string
          enum:
          - E1显著改善
          - E2部分改善
          - E3稳定
          - E4无明显改善
          - E5加重
          x-field-group: derived_result
          x-visible-to:
          - therapist
          - meridian
          - admin
        refund_eligibility:
          type: boolean
          x-field-group: derived_result
          x-visible-to:
          - therapist
          - meridian
          - admin
    VerdictData:
      type: object
      properties:
        verdict_id:
          type: string
        branch:
          type: string
          enum:
          - 稳定
          - 依从不足
          - 达标无效
          - 全面评估
          - 人工复核
          x-visible-to:
          - meridian
          - admin
        confidence:
          type: number
          x-visible-to:
          - meridian
          - admin
        evidence_snapshot:
          type: object
          x-visible-to:
          - meridian
          - admin
        threshold_version:
          type: string
          x-visible-to:
          - meridian
          - admin
        decided_at:
          type: string
          format: date-time
          x-visible-to:
          - meridian
          - admin
    CreateVerdictRequest:
      type: object
      required:
      - customer_id
      - sequence_no
      - same_origin
      - adherence
      - risk_flag
      - core_metric_improved
      - confidence
      - module_scores
      x-request-body-captured: A-2 (2026-09-26)
      properties:
        customer_id:
          type: string
          description: 客户（用于历史查询与越权判定）
        sequence_no:
          type: integer
          minimum: 1
          description: 第 N 次评估
        base_total:
          type: integer
          description: 基线模块总分；缺失 ⇒ 挂起（D5）
        current_total:
          type: integer
          description: 复评模块总分；缺失 ⇒ 挂起（D5）
        same_origin:
          type: object
          description: 同源断言（三项；任一项缺省 = 不成立 = 不可比 ⇒ 挂起）
          properties:
            same_item_group:
              type: boolean
            range_matches:
              type: boolean
            same_measurer:
              type: boolean
        adherence:
          type: object
          description: 依从四维（键为 A1/A3/A4；🛑 A2 永不参与 AS）
          properties:
            expected_days:
              type: integer
              minimum: 0
            dimensions:
              type: object
              additionalProperties:
                type: object
                properties:
                  applicable:
                    type: boolean
                  value:
                    type: number
                  structural_missing:
                    type: boolean
        risk_flag:
          type: string
          enum:
          - 无
          - 高危
          - 新发
          - 同病
          description: 🛑 缺失 ⇒ 未定（不得默认「无」—— 那会让 D4 该触发而不触发）
        core_metric_improved:
          type: boolean
          description: 经络师结构化录入；缺失 ⇒ 挂起
        confidence:
          type: object
          description: 置信度四项因子
          properties:
            same_origin_status:
              type: string
            answered_count:
              type: integer
              minimum: 0
            expected_days:
              type: integer
              minimum: 0
            mcid_delta:
              type: integer
        module_scores:
          type: object
          description: 模块分 M1–M5（各 0–16）
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 16
        band_trend_note:
          type: string
          description: 手环趋势说明（U-15 四条备注语义的载体）
        threshold_version:
          type: string
          description: '🛑【断言位，不是取值位】可空（空 = 服务端按当前口径填）；

            非空时必须逐字等于服务端算出的内容寻址指纹，否则拒写 4001。

            '
    CreateCycleAssessmentRequest:
      type: object
      required:
      - cycle_id
      - sequence_no
      - adherence
      - module_scores
      x-request-body-captured: 本批（与 F1 同批冻结）
      properties:
        cycle_id:
          type: string
          description: 周期评估主键（必填 —— 使 F1 能在同一行上补判定）
        sequence_no:
          type: integer
          minimum: 1
          description: 第 N 次评估（每 7 次触发）
        adherence:
          type: object
          description: 依从四维（与 F1 同一形状 —— 两侧对同一事实不得有两套字段名）
          properties:
            expected_days:
              type: integer
              minimum: 0
            dimensions:
              type: object
              additionalProperties:
                type: object
                properties:
                  applicable:
                    type: boolean
                  value:
                    type: number
                  structural_missing:
                    type: boolean
        expected_days:
          type: integer
          minimum: 0
          description: 应填天数（样本护栏）
        module_scores:
          type: object
          description: 模块分 M1–M5（各 0–16）
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 16
        band_trend_note:
          type: string
        threshold_version:
          type: string
          description: 断言位（可空 = 服务端填；非空须逐字等于服务端指纹）
    AuditCoverageData:
      type: object
      properties:
        ecc_count:
          type: integer
          description: ECC 数
        denominator_closed_courses:
          type: integer
          description: 分母（结案疗程数）
        decidable_coverage_rate:
          type: number
          description: 可判定覆盖率
        a3_observability:
          type: string
          x-tbd-allowed: true
          description: 预留，本版不返回值（TBD）；上限 = s
    RefundCreateRequest:
      type: object
      required:
      - customer_id
      - entry
      - refund_route
      - reason_code
      - requested_at
      properties:
        customer_id:
          type: string
        entry:
          type: string
          enum:
          - A门店代录
          - B首周期
        refund_route:
          type: string
          enum:
          - 履约类
          - 效果类
        reason_code:
          type: string
          enum:
          - 效果未达预期
          - 症状加重或出现新不适
          - 服务体验或沟通问题
          - 时间·经济·家庭原因
          - 配合度不足导致无明显变化
          - 信任或价格异议
          description: 必填；未记录原因不可结案
        requested_at:
          type: string
          format: date-time
          description: 最早且可核实
        requested_at_claimed:
          type: string
          format: date-time
          description: 客户主张，仅留存不计时
        customer_statement:
          type: string
          description: append-only 原话
    RefundData:
      type: object
      properties:
        refund_id:
          type: string
        liable_store_id:
          type: string
        sla_due_at:
          type: string
          format: date-time
        recording_delay_h:
          type: number
        outcome:
          type: string
          enum:
          - 继续
          - 终止
          - 归档
    RefundReceiptData:
      type: object
      properties:
        receipt_state:
          type: string
          enum:
          - 已推送
          - 未授权（转线下）
          - 推送失败
          description: 三态留痕
    DocType:
      type: string
      enum:
      - 知情同意书
      - 调理协议书
      - 手环数据说明
