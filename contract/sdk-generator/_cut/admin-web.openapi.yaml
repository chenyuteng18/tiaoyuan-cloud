openapi: 3.0.3
info:
  title: 上医智养堂 · 三端接口契约（调元云）
  version: api-contract-v1.0.0
  description: "三端（客户小程序 / 调理师·经络师 APP / 管理员 Web）一次冻结的接口契约。\n\n版本号规则（语义化，与 info.version 同值）：\n  - MAJOR（破坏级）：字段删除 / 改名 / 类型变更；可见性档位变更；枚举值语义变更；错误码语义变更；\n    涉可见性档位的 MAJOR 变更须触发「变更业务裁定」（不得按\"体验优化\"处理）。\n  - MINOR（兼容级）：新增可选请求字段 / 新增接口 / 新增响应字段。\n  - PATCH（文档级）：注释 / 示例 / 措辞修正，不动字段与语义。\n\n\U0001F6D1 措辞纪律：client_end=mp 可见字段不得含\"退款\"\"诊断\"；同步时间精确到日。\n"
  contact:
    name: 后端主程（技术单签）· 产品共签（可见性 / 措辞档位）
  license:
    name: Proprietary
servers:
- url: /api/v1
  description: Base Path（契约 §2.0 全局约定）
tags:
- name: A-租户与权限
  description: 登录 / 身份与可见性档位下发 / 门店列表
- name: B-客户与档案
  description: 禁忌筛查 / 建档 / 同意书 / 档案详情 / 建档扩展档案
- name: C-评估与题库
  description: 题库拉取 / 基线评估 / 周期评估
- name: D-服务与履约
  description: 服务核销 / 每日填报 / 方案与审核 / 设备参数下发
- name: E-设备与手环数据
  description: 同步批次四态 / 遥测上行 / 原始数据 / 派生结果 / 日期探测 / 同步状态卡
- name: F-判定与稽核
  description: 判定结论落库 / 判定历史 / 稽核信号 / 可判定覆盖率
- name: G-退款与挽留
  description: 代录诉求 / 工单详情 / 挽留 / 审批 / 回执（客户端与调理师端一律 403）
- name: H-文书与电子签
  description: 厂商回调接收端点（占位 · 待厂商选定后冻结）
- name: I-文书模板与渲染
  description: 模板列表 / 新建 / 上传 / 版本 / 发布 / 下载 / 签署时渲染（占位 · 字段未冻结）
x-global-conventions:
  base-path: /api/v1
  auth: 'Authorization: Bearer <token>（token 内嵌 tenant_id / role / staff_id）'
  tenant-context: '服务端从 token 取 tenant_id；请求头 X-Tenant-Id 若存在必须与 token 一致，

    否则 403 TENANT_MISMATCH。跨租户资源一律 403（存储层直接拒绝，

    不返回 404 以避免存在性探测）。

    '
  envelope: '{ "code": 0, "message": "ok", "data": {...}, "trace_id": "..." }'
  envelope-rule: code != 0 时 data 为空
  pagination: 请求 ?page=<int>&page_size=<int≤100>；响应 data.{items[], total, page, page_size}；page/page_size 越界（<1 或 >100）一律 400 VALIDATION_FAILED（拒，不夹逼）
  visibility: 每个接口的响应字段按 x-visibility 矩阵在服务端裁剪；无权限字段不下发（不是 null、不是空串）
  forbidden-403: 「前置门禁缺失」与「可见性档位不足」统一返回 403，message 必须给出缺失项名称 / 档位名称（不得模糊报错）
  idempotency: 写接口接受 Idempotency-Key 请求头（UUID）；服务端在 24h 窗口内去重
x-api-protocol:
  auth-header: Authorization
  auth-scheme: Bearer
  tenant-header: X-Tenant-Id
  tenant-mismatch-invariant: X-Tenant-Id 若存在必须与 token 内 tenant_id 一致（仅校验、不采纳），否则 403 TENANT_MISMATCH；跨租户资源一律 403
  trace-header: X-Trace-Id
  idempotency-header: Idempotency-Key
  idempotency-window-hours: 24
  envelope-fields:
  - code
  - message
  - data
  - trace_id
  envelope-ok-code: 0
  envelope-rule: code != 0 时 data 为空
  pagination:
    request-fields:
    - page
    - page_size
    response-fields:
    - items
    - total
    - page
    - page_size
    page-min: 1
    page-size-min: 1
    page-size-max: 100
    page-size-default: 20
    over-range-policy: reject-400
    over-range-error: VALIDATION_FAILED
    echo-policy: 回显"实际生效值"（缺省时回显缺省值，拒时不回显）
x-field-groups:
  raw_data:
    name: ① 手环原始数据
    fields: 睡眠 / 步数 / 心率 / 静息心率 / 血氧 / 运动类型
  capture_status:
    name: ② 采集状态
    fields: 已采集天数 / 同步时间（synced_at，精确到日）/ 接入状态
  gap_reason:
    name: ③ 缺口原因分类
    fields: gap_reason
  derived_result:
    name: ④ 派生结果
    fields: 依从性维度分（含 A3）/ AS 值 / effect_verdict / 退款资格
x-visibility-matrix:
  raw_data:
    client: true
    therapist: true
    meridian: true
    admin: true
    store_customer_service: false
  capture_status:
    client: true
    therapist: true
    meridian: true
    admin: true
    store_customer_service: false
  gap_reason:
    client: false
    therapist: true
    meridian: true
    admin: true
    store_customer_service: false
  derived_result:
    client: false
    therapist: true
    meridian: true
    admin: true
    store_customer_service: false
  notes:
  - 门店客服无端（不使用系统）—— 该界面不成立，任何字段组均不成立
  - admin 档位另按行级 scope 收窄（本店 / 辖区 / 全量）
  - 客户侧 ③④ 为硬约束、不得通过配置放开 —— 放开属「变更业务裁定」
x-roles:
  client:
    token-role: client
    end: mp
    display: 客户（小程序）
  therapist:
    token-role: therapist
    end: app
    display: 调理师（APP）
  meridian:
    token-role: meridian
    end: app
    display: 经络师（APP）
  admin:
    token-role:
    - manager
    - area
    - hq
    end: web
    display: 管理员（门店负责人 / 区域督导 / 总部运营）
  store_customer_service:
    token-role: null
    end: null
    display: 门店客服（无端，无任何接口）
x-wording-discipline:
  client-forbidden-terms:
  - 退款
  - 诊断
  - 未佩戴
  - 缺失
  - 达标
  - 不达标
  - 无效退款
  - 概不退款
  client-visible-naming-rules:
    R1: 客户可见字段名 / 枚举值不得含"退款"
    R2: 客户可见字段名 / 枚举值不得含"诊断"
    R3: 客户可见不出现派生结论（字段整体不下发）
    R4: 客户可见同步时间精确到日，不得到分秒
    R5: 客户可见正向计数 + 中性描述
    R6: 未接入态不得用 0 / 空图表 / 示例数据顶替
    R7: 客户可见不得出现"达标/未达标"评价
    R8: 派生结论侧禁用"不利"色 / 措辞
  namespace-isolation: 客户可见枚举以 client_* 前缀；内部枚举以 internal_* / 原名 —— 两套不得共用类型定义
x-error-codes:
- http: 400
  code: 1001
  name: VALIDATION_FAILED
  trigger: 参数类型 / 必填 / 约束不满足
- http: 401
  code: 1002
  name: UNAUTHENTICATED
  trigger: 无 token / token 过期 / token 非法
- http: 403
  code: 2001
  name: VISIBILITY_DENIED
  trigger: 该角色对请求字段组无可见性档位（服务端裁剪，非前端不渲染）
- http: 403
  code: 2002
  name: GATE_MISSING
  trigger: 前置门禁缺失（data.missing_items 给出缺失项名）
- http: 403
  code: 2003
  name: TENANT_MISMATCH
  trigger: 跨租户访问 / 租户头与 token 不符
- http: 404
  code: 3001
  name: NOT_FOUND
  trigger: 资源不存在（仅限本租户内确实不存在）
- http: 409
  code: 4001
  name: VERSION_CONFLICT
  trigger: 版本不可覆盖（plan / scale_item_bank / verdict）
- http: 409
  code: 4002
  name: IDEMPOTENT_REPLAY
  trigger: 幂等键命中已有记录（返回首次结果）
- http: 422
  code: 5001
  name: BUSINESS_RULE_VIOLATED
  trigger: 业务规则不满足（如题组量程 ≠ 0–4）
- http: 429
  code: 6001
  name: RATE_LIMITED
  trigger: 触发节流（如 onShow 5 分钟窗口）
- http: 500
  code: 9001
  name: INTERNAL_ERROR
  trigger: 服务端异常
- http: 403
  code: 2004
  name: PLACEHOLDER_OUT_OF_SCOPE
  trigger: 占位符越界（模板含未在白名单的占位符）— 域 I 新增
paths:
  /auth/login:
    post:
      operationId: authLogin
      tags:
      - A-租户与权限
      summary: A1 登录，签发 token
      x-contract-row: A1
      x-callable-roles:
      - client
      - therapist
      - meridian
      - admin
      x-client-forbidden: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - account
              - credential
              - client_end
              properties:
                account:
                  type: string
                  description: 员工号 / 客户 openid 绑定号
                credential:
                  type: string
                  description: 密码 / 短信码
                client_end:
                  type: string
                  enum:
                  - mp
                  - app
                  - web
                  x-visibility-note: client_end=mp 时可见字段须过 §5.1 R1~R8 词表校验
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ResultEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/LoginData'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantMismatch'
  /auth/me:
    get:
      operationId: authMe
      tags:
      - A-租户与权限
      summary: A2 当前身份 + 角色 + 可见性档位解算结果（可见性档位唯一权威下发点）
      description: '⚠️ 本接口只下发「档位布尔值」，不下发任何业务字段 —— 它是声明，不是数据。

        三端 UI 依此声明决定渲染分支，但字段仍由服务端裁剪（X-1：声明 ≠ 授权，二者须一致）。

        '
      x-contract-row: A2
      x-callable-roles:
      - client
      - therapist
      - meridian
      - admin
      x-client-forbidden: false
      responses:
        '200':
          description: 身份与档位
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ResultEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AuthMeData'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /stores:
    get:
      operationId: listStores
      tags:
      - A-租户与权限
      summary: A3 门店列表（按行级 scope 过滤）
      x-contract-row: A3
      x-callable-roles:
      - therapist
      - meridian
      - admin
      x-client-forbidden: false
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 门店分页
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ResultEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StoreListData'
        '403':
          $ref: '#/components/responses/VisibilityDenied'
  /screening-records:
    post:
      operationId: createScreeningRecord
      tags:
      - B-客户与档案
      summary: B1 禁忌筛查提交（硬门禁①）
      description: '命中禁忌（result=不通过）→ 客户状态置 REJECTED，后续 B2/B3 入口 403 GATE_MISSING

        （missing_items=["screening_result"]）。记录不可删除。

        '
      x-contract-row: B1
      x-callable-roles:
      - therapist
      - meridian
      - admin
      x-client-forbidden: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreeningCreateRequest'
      responses:
        '200':
          description: 筛查结果
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ResultEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ScreeningData'
        '400':
          $ref: '#/components/responses/ValidationFailed'
  /customers:
    post:
      operationId: createCustomer
      tags:
      - B-客户与档案
      summary: B2 建档（POST /archive 语义）
      description: 需 screening_result=通过。phone 为租户内唯一（跨店识别键）。
      x-contract-row: B2
      x-callable-roles:
      - therapist
      - meridian
      - admin
      x-client-forbidden: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreateRequest'
      responses:
        '200':
          description: 建档结果
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ResultEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CustomerCreateData'
        '403':
          $ref: '#/components/responses/GateMissing'
  /customers/{id}/consents:
    post:
      operationId: signConsent
      tags:
      - B-客户与档案
      summary: B3 签知情同意书
      description: 需 PROFILED（门禁 G1：未建档不得签知情同意书）。
      x-contract-row: B3
      x-callable-roles:
      - therapist
      - meridian
      - admin
      x-client-forbidden: false
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: 签署结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEnvelope'
        '403':
          $ref: '#/components/responses/GateMissing'
  /customers/{id}:
    get:
      operationId: getCustomer
      tags:
      - B-客户与档案
      summary: B4 客户详情（可见性裁剪重点接口）
      description: '🔴 客户 token 请求含派生字段的 query（如 ?include=verdict）→ 403 VISIBILITY_DENIED，

        data.denied_fields 回显被拒字段名。

        '
      x-contract-row: B4
      x-callable-roles:
      - client
      - therapist
      - meridian
      - admin
      x-client-forbidden: false
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      - name: include
        in: query
        required: false
        schema:
          type: string
        description: 追加字段（如 verdict）；命中客户不可见字段组时 403 VISIBILITY_DENIED
      responses:
        '200':
          description: 客户详情（已按矩阵裁剪）
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ResultEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CustomerDetailData'
        '403':
          $ref: '#/components/responses/VisibilityDenied'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{id}/intake-profile:
    get:
      operationId: getIntakeProfile
      tags:
      - B-客户与档案
      summary: B5 建档扩展档案
      x-contract-row: B5
      x-callable-roles:
      - client
      - therapist
      - meridian
      - admin
      x-client-forbidden: false
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: 建档扩展档案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEnvelope'
    patch:
      operationId: patchIntakeProfile
      tags:
      - B-客户与档案
      summary: B6 补充 + 修订（append-only 留痕，不可覆盖）
      x-contract-row: B6
      x-callable-roles:
      - therapist
      - meridian
      - admin
      x-client-forbidden: false
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: 修订结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEnvelope'
  /scale-item-banks:
    get:
      operationId: listScaleItemBanks
      tags:
      - C-评估与题库
      summary: C1 题库拉取（按分龄组 + 维度）
      x-contract-row: C1
      x-callable-roles:
      - client
      - therapist
      - meridian
      - admin
      x-client-forbidden: false
      parameters:
      - name: age_group
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/AgeGroup'
      - name: dimension
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Dimension'
      - name: version
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 题组
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEnvelope'
  /customers/{id}/assessments/baseline:
    post:
      operationId: submitBaselineAssessment
      tags:
      - C-评估与题库
      summary: C2 基线评估提交（同源题组锁定）
      description: '错误码：5001（题组量程 ≠ 0–4 / 题组非 symptom 向 / 缺分龄锁定）→ 提交阻断。

        '
      x-contract-row: C2
      x-callable-roles:
      - therapist
      - meridian
      - admin
      x-client-forbidden: false
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaselineAssessmentRequest'
      responses:
        '200':
          description: 基线评估结果
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ResultEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/BaselineAssessmentData'
        '422':
          $ref: '#/components/responses/BusinessRuleViolated'
  /customers/{id}/assessments/{assessment_id}:
    get:
      operationId: getAssessment
      tags:
      - C-评估与题库
      summary: C3 评估详情
      x-contract-row: C3
      x-callable-roles:
      - client
      - therapist
      - meridian
      - admin
      x-client-forbidden: false
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      - name: assessment_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 评估详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{id}/cycle-assessments:
    post:
      operationId: submitCycleAssessment
      tags:
      - C-评估与题库
      summary: C4 周期评估提交（每 7 次触发）
      description: '🛑 两阶段模型第一阶段的落点：本端点只落【评估侧依据】

        （cycle_assessment.verdict IS NULL = 待判定），不落任何判定结论。

        判定由 F1（POST /cycle-assessments/{id}/verdicts）在同一行上补全。

        错误码：5001（题组量程 ≠ 0–4 / 缺分龄锁定）；4001（同一 cycle_id 重复提交）。

        '
      x-contract-row: C4
      x-callable-roles:
      - therapist
      - meridian
      - admin
      x-client-forbidden: false
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCycleAssessmentRequest'
      responses:
        '200':
          description: 周期评估结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEnvelope'
        '422':
          $ref: '#/components/responses/BusinessRuleViolated'
  /customers/{id}/visits:
    post:
      operationId: createVisit
      tags:
      - D-服务与履约
      summary: D1 服务核销（四道闸门）
      x-contract-row: D1
      x-callable-roles:
      - therapist
      - meridian
      - admin
      x-client-forbidden: false
      parameters:
